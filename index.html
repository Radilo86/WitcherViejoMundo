<script>
(function(){const A=window.ASSET||{};const R=/assets\/[\w.-]+\.(?:jpg|png)/g;
function fx(el){if(el.nodeType!==1)return;if(el.tagName==='IMG'){const s=el.getAttribute('src');if(s&&A[s])el.src=A[s];}
const st=el.getAttribute('style');if(st&&st.indexOf('assets/')>=0)el.setAttribute('style',st.replace(R,m=>A[m]||m));}
function walk(n){fx(n);if(n.querySelectorAll)n.querySelectorAll('img,[style]').forEach(fx);}
new MutationObserver(ms=>{for(const m of ms){if(m.type==='attributes')fx(m.target);else m.addedNodes.forEach(walk);}}).observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['src','style']});
document.addEventListener('DOMContentLoaded',()=>{walk(document.body);const s=document.getElementById('setup');if(s)s.style.backgroundImage='url('+A['assets/map.jpg']+')';});
window.assetURL=p=>A[p]||p;})();
</script>

<title>The Witcher: El Viejo Mundo</title>
<style>
/*
VOICE: sombrío y artesanal, como una mesa de juego de taberna a la luz de las velas.
IDEA: el propio tablero y las cartas reales del juego, sobre cuero oscuro con remates de latón.
PICTURE: el mapa del Continente ocupa la pantalla; las cartas y tableros reales aparecen en hojas de pergamino.
COLOUR and TYPE: cuero #16110d, latón #c9a35b, pergamino #e8dcc0, sangre #a3262b; serif clásica (Palatino/Georgia).
LAYOUT: cabecera con jugadores, mapa desplazable, dock inferior con pestañas; modales como hojas desde abajo.
*/
:root{--bg:#16110d;--bg2:#221a14;--bg3:#2d231b;--line:#4a3a2a;--gold:#c9a35b;--gold2:#e7c983;--ink:#efe4cf;--dim:#a8977c;--parch:#e8dcc0;--parch-ink:#2a1e14;--red:#b3343a;--green:#5e9b4d;--blue:#4d79c9;
--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 "Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;overflow:hidden;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:var(--sat) var(--sar) 0 var(--sal)}
.hidden{display:none!important}
/* cabecera */
#top{flex:none;background:linear-gradient(#2a2018,#1b140f);border-bottom:1px solid var(--line);padding:6px 8px 6px;display:flex;flex-direction:column;gap:5px}
#topline{display:flex;align-items:center;gap:8px}
#phase{flex:1;font-size:13px;color:var(--gold2);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icobtn{width:36px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--bg3);display:grid;place-items:center;font-size:17px}
#chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;padding:3px 8px 3px 3px;border-radius:20px;background:var(--bg3);border:1px solid var(--line);font-size:12.5px}
.chip.cur{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.face{width:28px;height:28px;border-radius:50%;background-size:auto 170%;border:2px solid #888;flex:none}
.chip b{color:var(--gold2)}
.stars{letter-spacing:-1px;color:var(--gold)}
/* mapa */
#mapbox{flex:1;position:relative;min-height:0}
#mapwrap{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;background:#0d0a08}
#map{position:relative;width:180%;}
#map img.board{display:block;width:100%;height:auto}
.loc{position:absolute;width:9%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%}
.loc.can{box-shadow:0 0 0 3px #f3d27a,0 0 18px 6px rgba(243,210,122,.75);animation:pulse 1.4s infinite;cursor:pointer}
.loc.here::after{content:"";position:absolute;inset:-6%;border-radius:50%;border:2px dashed rgba(255,255,255,.7)}
@keyframes pulse{50%{box-shadow:0 0 0 3px #fff3c4,0 0 26px 10px rgba(243,210,122,.95)}}
@media (prefers-reduced-motion:reduce){.loc.can{animation:none}}
.fig{position:absolute;width:5.2%;aspect-ratio:1;border-radius:50%;background-size:auto 175%;border:3px solid;transform:translate(-50%,-50%);box-shadow:0 2px 6px #000;transition:left .7s ease,top .7s ease;z-index:5}
.mtok{position:absolute;width:7%;aspect-ratio:1;border-radius:50%;background-size:cover;background-position:50% 18%;border:3px solid #8b1f22;transform:translate(-50%,-50%);box-shadow:0 2px 8px #000;z-index:4}
.mtok span{position:absolute;right:-12%;bottom:-12%;background:#8b1f22;color:#fff;font-size:10px;border-radius:9px;padding:0 5px;border:1px solid #f0c0a0}
.qmark{position:absolute;transform:translate(-50%,-50%);font-size:clamp(11px,2.4vw,18px);z-index:3;filter:drop-shadow(0 1px 2px #000)}
/* expansiones */
.htok{position:absolute;width:6%;aspect-ratio:1;border-radius:50%;background-size:cover;border:3px solid #d9b46a;transform:translate(-50%,-50%);box-shadow:0 2px 8px #000;z-index:4}
.exprow{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line)}.exprow input{width:22px;height:22px;margin-top:2px;accent-color:#c9a35b;flex:none}
#zoombtns{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:20}
#zoombtns .icobtn{background:rgba(34,26,20,.9)}
/* dock */
#dock{flex:none;background:var(--bg2);border-top:1px solid var(--line);padding-bottom:var(--sab);max-height:52vh;display:flex;flex-direction:column}
#bar{padding:8px;display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line)}
#bar .prompt{width:100%;font-size:13px;color:var(--dim)}
.btn{min-height:40px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg3);font-size:14px;text-align:left}
.btn.main{background:linear-gradient(#b38a45,#8a6630);border-color:#d9b46a;color:#1b130b;font-weight:bold}
.btn:disabled{opacity:.4}
.btn small{display:block;color:var(--dim);font-size:12px;line-height:1.25;margin-top:2px}
.btn.main small{color:#3b2a14}
#tabs{display:flex;border-bottom:1px solid var(--line)}
#tabs button{flex:1;padding:8px 2px;background:none;border:0;border-bottom:2px solid transparent;font-size:13px;color:var(--dim)}
#tabs button.on{color:var(--gold2);border-color:var(--gold)}
#tabbody{overflow:auto;padding:8px;min-height:120px}
.row{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.card{flex:none;width:96px;aspect-ratio:579/899;border-radius:6px;background-size:cover;box-shadow:0 2px 6px #000;position:relative;border:2px solid transparent}
.card.sel{border-color:#f3d27a;box-shadow:0 0 0 2px #f3d27a,0 0 14px #f3d27a}
.card.dim{opacity:.35;filter:grayscale(.6)}
.card .badge{position:absolute;left:4px;top:4px;background:#000c;color:var(--gold2);font-size:12px;border-radius:8px;padding:0 6px}
.card .num{position:absolute;right:4px;top:4px;background:#f3d27a;color:#000;font-weight:bold;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:13px}
.stat{display:grid;grid-template-columns:92px repeat(5,1fr) 54px;align-items:center;gap:4px;font-size:13px;margin:3px 0}
.pip{height:14px;border-radius:3px;background:#3a2d22;border:1px solid #514030}
.pip.on{background:var(--gold);border-color:var(--gold2)}
.kv{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin:6px 0}
.kv b{color:var(--gold2)}
.small{font-size:12px;color:var(--dim)}
.tlist{display:flex;flex-direction:column;gap:6px;font-size:13px}
.tlist .t{padding:6px 8px;background:var(--bg3);border:1px solid var(--line);border-radius:8px}
.tlist .t b{color:var(--gold2)}
.log div{font-size:12.5px;padding:2px 0;border-bottom:1px solid #2c221a}
.log .turn{color:var(--gold2);font-weight:bold;padding-top:6px}
.log .good{color:#9fd18a}.log .bad{color:#f0a09a}.log .sys{color:#c8b48a}
/* modal */
#modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
#sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--parch) url() ;color:var(--parch-ink);border-radius:16px 16px 0 0;padding:14px 14px calc(14px + var(--sab));box-shadow:0 -6px 30px #000;border-top:3px solid #9c7a3e}
#sheet h3{margin:0 0 8px;font-size:18px;letter-spacing:.02em}
#sheet .opts{display:flex;flex-direction:column;gap:7px;margin-top:8px}
#sheet .btn{background:#f4ead6;border-color:#b79c6b;color:var(--parch-ink)}
#sheet .btn small{color:#6c5a40}
#sheet .btn.main{background:linear-gradient(#a8282e,#7c1b20);border-color:#5a1013;color:#fff}
#sheet .btn.main small{color:#f4cfc8}
#sheet .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
#sheet .grid .card{width:100%}
#sheet .txt{font-size:14.5px;line-height:1.45}
#sheet .eff{margin-top:8px;padding:8px 10px;background:#f6eedc;border-left:4px solid #9c2a2e;font-weight:bold;font-size:14px}
.crop{width:100%;background-repeat:no-repeat;background-size:100% auto;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.35);margin:4px 0}
.optimg{display:flex;align-items:center;gap:8px}
.optimg img{width:46px;border-radius:4px;flex:none}
.bigcard{display:block;width:min(78vw,330px);margin:6px auto;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.5)}
.dice{display:flex;gap:6px;justify-content:center;margin:8px 0;flex-wrap:wrap}
.die{width:44px;height:44px;border-radius:9px;background:#fffaf0;border:2px solid #7a5f33;display:grid;place-items:center;font-size:26px;font-weight:bold;color:#2a1e14}
.die.sel{background:#f3d27a;border-color:#a8282e;transform:translateY(-4px)}
.die.big{width:84px;height:84px;font-size:52px}
.dlabel{font-size:12px;text-align:center;color:#6c5a40}
/* combate */
#combat{position:fixed;inset:0;z-index:40;background:radial-gradient(ellipse at top,#3a1d1a,#120c0a 70%);display:flex;flex-direction:column;padding:calc(var(--sat) + 6px) calc(var(--sar) + 8px) calc(var(--sab) + 6px) calc(var(--sal) + 8px);gap:6px}
#cfoe{display:flex;gap:10px;align-items:flex-start}
#cfoe .card{width:84px}
#cfoe .info{flex:1;font-size:13px}
#cfoe h4{margin:0 0 2px;font-size:17px;color:var(--gold2)}
.meter{display:flex;align-items:center;gap:6px;font-size:13px;margin:3px 0}
.meter .bar{flex:1;height:10px;background:#3a1f1c;border-radius:6px;overflow:hidden;border:1px solid #6b2b2b}
.meter .bar i{display:block;height:100%;background:linear-gradient(90deg,#8d1f25,#d0484c)}
#clog{flex:1;overflow:auto;font-size:12.5px;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:60px}
#clog div{padding:1px 0}#clog .turn{color:var(--gold2);margin-top:4px}#clog .good{color:#9fd18a}#clog .bad{color:#f0a09a}
#cme{font-size:13px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
#cme b{color:var(--gold2)}
#ccombo{display:flex;gap:4px;min-height:0;align-items:center;overflow-x:auto}
#ccombo .card{width:64px}
#cpred{font-size:13px;color:var(--gold2)}
#chand .card{width:84px}
#cacts{display:flex;flex-wrap:wrap;gap:6px}
#cacts .btn{flex:1 1 auto}
.lastatk{display:flex;gap:8px;align-items:center;font-size:12.5px;margin-top:4px}
.lastatk .card{width:54px}
/* inicio */
#setup{position:fixed;inset:0;z-index:60;background:#0d0a08 center/cover;overflow:auto}
#setup .veil{min-height:100%;background:linear-gradient(rgba(10,7,5,.75),rgba(10,7,5,.92));padding:calc(var(--sat) + 18px) 16px calc(var(--sab) + 24px)}
#setup h1{margin:6px 0 2px;font-size:30px;line-height:1.05;color:var(--gold2);text-align:center;text-shadow:0 2px 8px #000}
#setup .sub{text-align:center;color:var(--dim);margin-bottom:14px}
.panel{background:rgba(34,26,20,.92);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px auto;max-width:560px}
.panel h2{margin:0 0 8px;font-size:16px;color:var(--gold2)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--bg3)}
.seg button.on{background:linear-gradient(#b38a45,#8a6630);color:#1b130b;border-color:#d9b46a;font-weight:bold}
.schools{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sch .pic{max-height:110px;width:100%}
.sch{border-radius:10px;border:2px solid var(--line);overflow:hidden;background:var(--bg3);padding:0 0 4px;font-size:11px;text-align:center}
.sch .pic{aspect-ratio:1;background-size:auto 175%;}
.sch.on{border-color:var(--gold2);box-shadow:0 0 10px var(--gold)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 30%);z-index:70;background:rgba(20,14,10,.95);border:1px solid var(--gold);color:var(--ink);padding:8px 14px;border-radius:10px;font-size:14px;max-width:88vw;pointer-events:none;opacity:0;transition:opacity .25s}
#toast.on{opacity:1}
#zoom{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.85);display:grid;place-items:center;padding:20px}
#zoom img{max-width:100%;max-height:78vh;border-radius:12px;display:block;margin:0 auto}
.ship{position:absolute;transform:translate(-50%,-50%);font-size:20px;z-index:6;text-shadow:0 0 4px #000}
.skisl{position:absolute;transform:translate(-50%,-50%);width:9%;aspect-ratio:420/651;background-size:cover;border-radius:6px;border:2px solid #e2b54c;z-index:4;cursor:pointer}
.dagtok{position:absolute;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background-size:cover;background-position:center 20%;border:3px solid #3fae9a;z-index:7;box-shadow:0 0 10px #0f6;cursor:pointer}
.dagtok.up{border-color:#e33;box-shadow:0 0 14px #f33;width:48px;height:48px}
.lnk{text-decoration:underline;color:#e2b54c;cursor:pointer}
.wtok{position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:#2a1d10;border:2px solid #e2b54c;color:#f3d27a;display:grid;place-items:center;font-size:15px;z-index:6;box-shadow:0 0 8px rgba(226,181,76,.7);cursor:pointer}
#zoom .zwrap{max-width:520px}
#zoom .ztxt{margin-top:10px;background:rgba(34,26,20,.95);border:1px solid #6b5536;border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.35;color:#f1e6cf}
/* tutorial */
#tut{position:fixed;inset:0;z-index:75;background:var(--parch);color:var(--parch-ink);display:flex;flex-direction:column;padding:var(--sat) var(--sar) 0 var(--sal)}
#tutTop{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#2a2018;color:var(--gold2)}
#tutTop .icobtn{color:var(--ink)}

#tutNav button{flex:none;border:1px solid #b79c6b;background:#f4ead6;border-radius:16px;padding:6px 12px;font-size:13px;color:var(--parch-ink)}
#tutNav button.on{background:#7c1b20;color:#fff;border-color:#5a1013}
#tutBody{flex:1;overflow:auto;padding:12px 16px 20px;font-size:15.5px;line-height:1.5}
#tutBody h2{margin:2px 0 8px;font-size:22px;line-height:1.15}
#tutBody .tg{font-size:12px;color:#7a6446}
#tutBody ul,#tutBody ol{padding-left:20px;margin:6px 0}#tutBody li{margin:4px 0}
.ttip{margin:10px 0;padding:8px 10px;background:#f6eedc;border-left:4px solid #9c2a2e;font-size:14px}
.timg{display:block;max-width:100%;border-radius:8px;margin:8px auto;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.timg.half{width:min(70%,300px)}
.trow{display:flex;gap:6px;overflow-x:auto;align-items:center;padding:4px 0}
.tcard{width:92px;flex:none;border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.tcard.s{width:62px}.tcard.dim{opacity:.3;filter:grayscale(.7)}
.tbox{background:#efe3c8;border:1px solid #b79c6b;border-radius:10px;padding:8px;margin:8px 0}
.tbtn{min-height:40px;border-radius:10px;border:1px solid #5a1013;background:#7c1b20;color:#fff;padding:6px 14px;margin-top:6px}
.tres{font-size:15px;margin:4px 0}
.tdice{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
.tdie{width:38px;height:38px;border-radius:8px;background:#fffaf0;border:2px solid #7a5f33;display:grid;place-items:center;font-weight:bold;font-size:20px}
.ttab{border-collapse:collapse;width:100%;font-size:14px}.ttab td,.ttab th{border-bottom:1px solid #c9b48a;padding:6px;text-align:left}
#tutBar{display:flex;gap:8px;padding:8px 12px calc(8px + var(--sab));border-top:1px solid #b79c6b;background:#e0d1b0}
#tutBar .btn{flex:1;background:#f4ead6;border-color:#b79c6b;color:var(--parch-ink);text-align:center}
#tutBar .btn.main{background:linear-gradient(#a8282e,#7c1b20);color:#fff;border-color:#5a1013}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div id="topline"><div id="phase">The Witcher: El Viejo Mundo</div><button class="icobtn" id="btnMenu" aria-label="Menú">☰</button></div>
    <div id="chips"></div>
  </header>
  <main id="mapbox">
    <div id="mapwrap"><div id="map"><img class="board" src="assets/map.jpg" alt="Mapa del Continente"><div id="marks"></div></div></div>

</div>
<div id="combat" class="hidden">
  <div id="cfoe"></div>

</div>

<div id="setup"><div class="veil" id="setupBody"></div></div>
<script>
// ===== The Witcher: El Viejo Mundo — datos estáticos =====
// Coordenadas de mapa en píxeles del tablero original (3680x2808). El mapa recortado empieza en x=1050.
const MAP = { x0: 1050, w: 2412, h: 2808, img: 'assets/map.jpg' };
const TERR = { F: 'Bosque', M: 'Montaña', W: 'Agua' };
const ATTRS = ['atk', 'def', 'alc', 'spe'];
const ATTR_NAME = { atk: 'Combate', def: 'Defensa', alc: 'Alquimia', spe: 'Especialidad' };
const VAL = [0, 1, 2, 3, 4, 4]; // valor por nivel de atributo (tablero de jugador)

const LOCS = [
  { id: 0, name: 'Behelt Nar', terr: 'W', x: 3138, y: 1500, act: 'school', school: null, noToken: true },
  { id: 1, name: 'Kaer Seren', terr: 'W', x: 1272, y: 429, act: 'school', school: 'grifo' },
  { id: 2, name: 'Hengfors', terr: 'M', x: 2271, y: 444, act: 'track' },
  { id: 3, name: 'Kaer Morhen', terr: 'M', x: 3210, y: 309, act: 'school', school: 'lobo' },

puesta de trabajo estable a cambio de una paga justa, la perspectiva te parece atractiva.", "optA": "Acepta la oferta.", "optB": "Recházala. Aún te queda mucho continente por ver.", "resA": "Antes de conseguir el trabajo, los mercaderes deciden ponerte a prueba. Te enfrentas en duelo al mejor guerrero mercenario del gremio y... pierdes. Puedes olvidarte del cómodo contrato, pero el gremio aún tiene un pequeño trabajo para ti.", "resB": "El representante del gremio acepta tu negativa con pesar. Antes de marcharse, menciona ciertos problemas que han asolado recientemente a los proveedores del gremio.", "txtA": "Reduce tu nivel de Combate en 1. Búsqueda: Bosque Entrada: Evento 32.", "txtB": "Obtén 1 Rastro cualquiera.", "A": [["attr", "atk", -1], ["quest", "F", 32, 0]], "B": [["trail"]], "y": [197, 246, 390, 672]}, "023-202": {"deck": "city", "intro": "Wéllando sales a la parte trasera de la posada para aliviar tu vejiga, eres testigo de cómo cinco hombres con cuerdas intentan capturar a una bestia. ¿Qué hace un monstruo en medio de la ciudad? Rápidamente te das cuenta de que la bestia es en realidad un humanoide sintiente al que la mala fortuna o la magia han maldecido con una cabeza de nutria.", "optA": "Dispersa a los atacantes.", "optB": "Ayuda a los hombres a capturar a la criature", "resA": "Tres asaltantes huyen al ver tu medallón. Los dos hombres restantes no son un desafío para vosotros dos.", "resB": "Justo cuando parece que todo ha terminado, la criatura consigue liberarse y huye. Sus garras te alcanzan de forma dolorosa más de una vez. \"Se suponía que debíamos entregar esta cosa en el puerto de Novigrado. Pagan bien por criaturas como esta.”", "txtA": "Aumenta tu nivel de Atributo más bajo en 1.", "txtB": "Tira un dado: 1-3: Reduce tu nivel de Escudo en 3. 4-6: Reduce tu nivel de Escudo en 2. Independientemente de tu tirada, además: Búsqueda: 6. Novigrado Entrada: Evento 33.", "A": [["attr", "low", 1]], "B": [["dice", [[1, 3, [["shield", -3]]], [4, 6, [["shield", -2]]]]], ["quest", 6, 33, 0]], "y": [277, 317, 383, 524]}, "023-203": {"deck": "city", "intro": "lb ulendo ciertos rumores, llegas a una sombría posada de dudosa reputación. Los clientes man-- tienen conversaciones en voz baja y ocultan sus. rostros bajo capuchas o pañuelos. Te sientas junto al hombre de quien hablan los rumores. \"¡Puedo prepararte una poción que hace a un hombre más rápido que una amante huyendo de un marido celoso! Mi pericia, tus ingredientes: ¿qué dices?.\"", "optA": "Amenázale con informar a la guardia de la ciudad de sus turbios negocios.", "optB": "Acepta y entrégale tu reserva de hierbas.", "resA": "El hombre resopla, claramente ofendido, y te pasa unas monedas por encima de la mesa. \"Toma esto, vete y cállate.\"", "resB": "Cuando te presentas al día siguiente para recoger la poción, el hombre no aparece por ninguna parte. Vuelves a la posada y averiguas dónde podría estar escondido.", "txtA": "Obtén 2 de Oro.", "txtB": "Descarta todas las Pociones. Búsqueda: Montaña Entrada: Evento 34.", "A": [["gold", 2]], "B": [["dpot", "all"], ["quest", "M", 34, 0]], "y": [305, 368, 451, 594]}, "023-204": {"deck": "city", "intro": "El poderoso aroma a incienso y hierbas que rodea a la mujer es lo suficientemente fuerte como para atenuar el olor que emana de una alcantarilla especialmente asquerosa que hay cerca. Las muchas capas de su ropa impiden evaluar su físico, y la pipa humeante que lleva entre los dientes se balancea arriba y abajo mientras habla. \"Vosotros, los brujos, sois expertos en pociones y aceites, pero ninguno de vosotros conoce a Gustav. ¡Ese es un hombre que sabe lo que hace!\".", "optA": "“¿Tienes una muestra de sus productos?”", "optB": "“¿Dónde puedo encontrar a ese Gustav?”", "resA": "La mujer te entrega un frasco cerrado.", "resB": "principio, se muestra reacia a contarte más, pero el tintineo de las monedas le suelta la lengua rápidamente.", "txtA": "Roba 1 Poción.", "txtB": "Pierde 2 de Oro. Búsqueda: Bosque Entrada: Evento 35.", "A": [["pot", 1]], "B": [["gold", -2], ["quest", "F", 35, 0]], "y": [365, 407, 511, 598]}, "023-205": {"deck": "city", "intro": "SUN hombre se reúne contigo en una mesa de una taberna abarrotada y posa dos jarras de cerveza. \"Estoy harto de las quejas de mi madre\", dice, \"Le! molestan casi todas las cosas y le da la espalda a todo lo demás. Y no puedo echarla, al fin y al cabo es su casa... Mi mujer y yo no podemos volver a nuestra casa. Algo malvado vive allí ahora, y no tengo las agallas para averiguar qué es. Ayúdame, brujo. Te lo ruego, sálvame de mi querida madre.\"", "optA": "Una jarra de cerveza y una ronda de póquer son los mejores aliados en un momento de desesperación. Ofrécele jugar una partida.", "optB": "G Acepta visitar su aldea e investigar la casa.", "resA": "Oe hombre ya está borracho y tu negativa le enfada. Derrama su cerveza sobre tu ropa e intenta golpearte desde el otro lado de la mesa.", "resB": "El hombre se alegra y corre a invitarte a otra ronda.", "txtA": "Añade 1 de las Cartas de Acción reveladas de coste 0 a tu pila de descartes.", "txtB": "Búsqueda: Montaña Entrada: Evento 36.", "A": [["gain", 0]], "B": [["quest", "M", 36, 0]], "y": [307, 410, 510, 681]}, "023-206": {"deck": "city", "intro": "dies EIA AA A Un petimetre vestido con un atuendo estrafalario se acerca a ti con paso alegre. 0 \"Necesito ayuda para cortejar a cierta bella dama. Seguro que me vería con otros ojos si ahuyentara a un mutante como tú. No te preocupes, puedo pagar. ¿Ves mi ropa? Estoy seguro de que puedo pagar tus tarifas.\"", "optA": "Su ropa parece cara... acepta ayudarle.", "optB": "Mándalo a paseo y hazle saber lo que significa enfadar a un mutante como tú.", "resA": "El hombre te detalla su plan por el camino. Cuanto más oyes, más te arrepientes de haber aceptado participar en su cortejo, pero una promesa es una promesa.", "resB": "Te das cuenta de que el petimetre debe de ser una figura local de renombre o tiene los bolsillos muy llenos. Pronto te abordan dos brutos con intenciones de robar. No son rivales para ti y rápidamente les quitas las armas.", "txtA": "Búsqueda: Bosque Entrada: Evento 37.", "txtB": "Añade 1 de las Cartas de Acción reveladas de coste 0 a tu pila de descartes.", "A": [["quest", "F", 37, 0]], "B": [["gain", 0]], "y": [247, 290, 410, 610]}, "025-216": {"deck": "city", "intro": "AOS brujos han tenido enemigos desde que existen brujos a los que odiar. Por desgracia, el odio: a lo desconocido no está reservado a las mentes. más simples. Has oído historias de desapariciones repentinas de jóvenes brujos adeptos. Ahora te enteras de que un poderoso mago ha estado secuestrando adeptos para deshacer sus mutaciones y \"salvarlos\".", "optA": "Encuentra a un mensajero que lleve la información a tu escuela.", "optB": "Hazle una visita al mago.", "resA": "El hombre se marcha con tu carta. Sientes una ira ardiente que empleas para avivar tu entrenamiento.", "resB": "Decides mostrarle al mago que la espada de un brujo es algo que debe temerse.", "txtA": "Pierdes 2 de Oro y aumentas tu nivel de Especialidad en 1.", "txtB": "Búsqueda: Montaña Entrada: Evento 38.", "A": [["gold", -2], ["attr", "spe", 1]], "B": [["quest", "M", 38, 0]], "y": [305, 371, 460, 630]}, "025-217": {"deck": "city", "intro": "WBcsde hace varios días tienes la extraña sensación de que la gente está un poco rara contigo, o mejor dicho, más rara de lo normal. Al verte, las madres llaman a sus hijos y las contra-- ventanas se cierran de golpe a tu paso. Finalmente, te encuentras con un joven que lleva un laúd y se muestra encantado de explicártelo. \"Hay un bardo que te ha convertido en el tema de sus baladas. Es que... no le gustan mucho los brujos, creo. En sus canciones robas niños, tienes colmillos afilados y... escupes fuego por el culo.\"", "optA": "Pregunta dónde puedes encontrar al bardo.", "optB": "Cuéntale al joven tus aventuras para que pueda componer baladas basadas en la verdad.", "resA": "Es hora de explicarle la existencia de la censura.", "resB": "El joven no tarda en aceptar y tiene unos cuántos versos listos para cuando terminas tu relato. También está dispuesto a pagar por tus historias.", "txtA": "Búsqueda: Agua Entrada: Evento 39.", "txtB": "Obtén 2 de Oro.", "A": [["quest", "W", 39, 0]], "B": [["gold", 2]], "y": [361, 406, 559, 703]}, "025-218": {"deck": "city", "intro": "El aire del mercado es una mezcla de olores a sudor humano, comida, piel curtida de animal y perfume. Te abres paso entre la multitud y llegas a un puesto de armero rodeado de una multitud de clientes y curiosos.", "optA": "No tienes tiempo de hacer cola. En su lugar, visitas el puesto del alquimista.", "optB": "Espera tu turno en el puesto del armero.", "resA": "Ya sea por el efecto de un fuerte aroma a hierbas y pociones, o por el propio talante misterioso del alquimista, el puesto no tiene clientes.", "resB": "“Bueno, yo seré... ¡un brujo! Necesitas productos especiales, ¿no? Bueno, pregunta por Landrag el arbalista en Vengerberg. ¡No encontrarás mejores ballestas que las de Landrag!\"", "txtA": "Roba 2 Pociones.", "txtB": "Búsqueda: 8. Vengerberg Entrada: Pierde 2 de Oro para comprar una Ballesta. Evento 14.", "A": [["pot", 2]], "B": [["quest", 8, 14, 2]], "y": [196, 259, 377, 521]}, "025-219": {"deck": "city", "intro": "bpas multicolores, sombrero de plumas y una voz capaz de adormecer incluso a una estriga, en otras palabras, un bardo. El hombre se acerca a. tu mesa y apoya su laúd en una pata de la mesa de roble. \"Eres un brujo, ¿verdad? Cuéntame tus historias y deja que mis floridos versos las conviertan en leyendas.\"", "optA": "Cuéntale tus aventuras.", "optB": "Ofrécete a viajar con el bardo.", "resA": "El bardo coge su laúd y te acompaña con una tranquila melodía. Te da las gracias y te regala unas monedas.", "resB": "El hombre vestido de vivos colores considera tu proposición, vacía su jarra de un trago y se limpia la boca. “¡Báñame en miel y arrójame a los súcubos si esto no es el comienzo de una maravillosa aventura!”", "txtA": "Obtén 2 de Oro.", "txtB": "Roba Evento 11.", "A": [["gold", 2]], "B": [["event", 11]], "y": [251, 294, 395, 537]}, "025-220": {"deck": "city", "intro": "US zona frente a la herrería se ha vallado para formar una arena improvisada. Se dice que: quien empuña un arma fabricada por el herrero. local nunca puede perder. Para demostrarlo, un hombre fornido y corpulento espera en la arena, blandiendo ociosamente su espada y esperando a un contrincante.", "optA": "Pide ver los artículos del herrero.", "optB": "Prueba suerte en la arena.", "resA": "Te enteras de que el artesano tiene un hermano, el mejor armero de esta parte del continente, y se dice que es el proveedor del mismísimo ejército temerio. Búsqueda: Montaña Entrada: Pierde 1 Oro para comprar una Armadura. Evento 13.", "resB": "En manos de un aficionado, ni la mejor espada es rival para la hoja de un brujo. Ganas el combate con facilidad.", "txtA": "", "txtB": "Aumenta tu nivel de Combate en 1. Tira un dado: 1-2: Reduce tu nivel de Escudo en 2. 3-4: Descarta 2 Pociones. 5-6: Desarmas fácilmente al matón.", "A": [["quest", "M", 13, 1]], "B": [["attr", "atk", 1], ["dice", [[1, 2, [["shield", -2]]], [3, 4, [["dpot", 2]]], [5, 6, []]]]], "y": [251, 294, 395, 623]}, "025-221": {"deck": "city", "intro": "e reúnes con un anciano, un hombre de ciencia que siempre está agradecido por las muestras que le traes de tus viajes. Una vez más, te da las. gracias por los restos de monstruos, por fin podrá empezar a trabajar en un defoliante que erradicará los arquespores. Como se acordó de antemano, paga tus servicios abriéndote su biblioteca durante todo el día.", "optA": "Busca información sobre monstruos.", "optB": "Busca información sobre las escuelas de brujos.", "resA": "La biblioteca del estudioso está llena de libros raros. Desempolvas un viejo tomo y te das cuenta de que es un tesoro que contiene valiosa información sobre monstruos.", "resB": "El estante superior de la biblioteca esconde un grueso volumen, \"La vida de Stefan Smola\". En su interior encuentras información sobre un misterioso brujo de la Escuela de la Grulla. Elestudioso te recomienda que viajes a Ard Modron si quieres aprender mucho más. Misión: 18. Ard Modron Entrada: Evento 26.", "txtA": "Obtén (hasta) 1 Rastro de cada monstruo.", "txtB": "", "A": [["trailAll"]], "B": [["quest", 18, 26, 0]], "y": [272, 315, 426, 596]}, "025-222": {"deck": "city", "intro": "“Un hombre te detiene en un callejón. Mientras habla, se humedece nerviosamente los labios y sigue mirando a algo por encima de tu hombro. \"Conozco un sitio para... bichos raros de las afueras, y mutantes, ¿sabes? Es un sitio donde todo el mundo se lo pasa siempre bien. ¿Te gustaría saber dónde está?\"", "optA": "Escúchalo. Le deben estar pagando por correr la voz.", "optB": "Muéstrale cómo te sientes cuando te llamar bicho raro y forastero.", "resA": "Ese lugar, es como un crisol donde se mezclan todos los bichos raros de este mundo. Nadie que haya estado allí se ha marchado con el ánimo más bajo que cuando llegó.\" Búsqueda: Montaña Entrada: Evento 21.", "resB": "El hombre debía estar preparado para tu reacción. Te agarra por el brazo y le aplica un doloroso giro, pero no puede hacer nada para contrarrestar el rodillazo dirigido directamente a su ingle. Cae con un gemido de dolor.", "txtA": "", "txtB": "Reduce tu nivel de Escudo en 1 y quema 1 carta. A continuación, añade 1 de las 6 Cartas de Acción reveladas a tu pila de descartes.", "A": [["quest", "M", 21, 0]], "B": [["shield", -1], ["burn", 1], ["gain", "any"]], "y": [249, 312, 428, 626]}, "025-223": {"deck": "city", "intro": "di medallón no es fiable en los solsticios. Y probablemente así es como el mercader pudo estafarte dinero. Te maldices por haber confiado en un calvo y por olvidar que un calvo pudo haber sido alguna vez un pelirrojo. La falsa cota de malla que acabas de comprar se desmorona apenas te alejas unos cuantos pasos del merca-", "optA": "Intimida al mercader y oblígale a venderte un nuevo par de botas a precio de ganga. Paga 3 de Oro para comprar unas botas de cuero.", "optB": "Denuncia al hombre a la guardia.", "resA": "Las suelas de tus botas viejas se han desgastado tanto que has empezado a dejar huellas en el camino. Tu nuevo par te queda perfecto.", "resB": "El mercader resulta ser un mago bien conocido por los guardias. Te piden que informes del asunto al Concilio.", "txtA": "Pierdes 3 de Oro y robas Evento 31.", "txtB": "Búsqueda: Montaña Entrada: Evento 2.", "A": [["gold", -3], ["event", 31]], "B": [["quest", "M", 2, 0]], "y": [273, 400, 497, 640]}, "025-224": {"deck": "city", "intro": "Qué velada tan agradable! No hay nada como una cerveza deliciosa, buena comida y una cama cómoda. Por la mañana te despiertan llamando. a la puerta de la buhardilla que has alquilado. \"¿Quieres escuchar la historia del profeta Lebioda?\" Hay dos hombres esperando al otro lado de la puerta.", "optA": "Cierra la puerta y vuelve a la cama.", "optB": "Un poco de filosofía durante el desayuno nunca hace daño a nadie.", "resA": "Te duermes en cuanto tu cabeza toca la almohada.", "resB": "Te das cuenta de que algo no va bien en cuanto los dos hombres entran en la habitación. No tienes posibilidad de alcanzar tu espada, y es difícil defenderse de una daga en el cuello con nada más que las manos desnudas. Lo único que puedes hacer es observar cómo el otro hombre rebusca en tus bolsas.", "txtA": "Durante la Fase III, roba 2 cartas adicionales.", "txtB": "Quema 1 carta. Búsqueda: Agua Entrada: Evento 25.", "A": [["p3", 2]], "B": [["burn", 1], ["quest", "W", 25, 0]], "y": [273, 316, 447, 561]}, "027-234": {"deck": "city", "intro": "Eres el invitado de Ulven, un mago al que consideras tu amigo. Tras las ventanas de su torre hay: una vista panorámica de la ciudad y las mon-. tañas que la rodean. El mago te tiende una copa de vino y brinda por tu amistad, luego entra en materia. \"No he hecho nada para merecer su odio, pero la maldita elfa la tiene tomada conmigo. Llevo un mes encerrado en la torre por miedo a una emboscada en la ciudad. Sé que es cuestión de tiempo que me encuentre aquí. ¿Podrías deshacerte de ella antes de que cause un mal mayor?\"", "optA": "El mal es el mal. Que sea un mal menor, mayor o mediocre, eso da igual... prefieres no elegir.", "optB": "Ocúpate del problema en nombre de la amistad.", "resA": "Mientras abandonas la ciudad, te encuentras con la mujer que mencionó Ulven. Agradecida por tu imparcialidad, te ofrece pasar la noche con sus compañeros.", "resB": "Ulven te dice dónde vieron sus informadores a la elfa por última vez.", "txtA": "Durante la Fase III, roba 2 cartas adicionales.", "txtB": "Búsqueda: Montaña Entrada: Evento 27.", "A": [["p3", 2]], "B": [["quest", "M", 27, 0]], "y": [391, 492, 580, 750]}, "027-235": {"deck": "city", "intro": "els mujer sobre la cama gime de dolor. Las quemaduras recientes de su cara tienen un aspecto terrible y es poco probable que recupere la vista. Su hijo te informa de que la mujer no es de por aquí. La acogió después de que fuera víctima de una banda de jóvenes que idearon una forma de matar el aburrimiento. Se colaban en la guarida de una vieja mantícora y recogían su veneno. Luego vertían el líquido corrosivo sobre los viandantes. La mujer simplemente tuvo mala suerte.", "optA": "Calma el dolor de la mujer.", "optB": "6 Averigua de dónde es la mujer.", "resA": "Los ungúentos y apósitos que preparas alivian el dolor. La mujer se duerme y su hijo te lo agadece.", "resB": "su hijo se alegra de que estés dispuesto a restablecer el orden. Puede que sea pobre, pero se ofrece a pagarte de todos modos.", "txtA": "Descarta 2 Pociones, obtén 3 de Oro y 1 Rastro cualquiera.", "txtB": "Obtén 1 de Oro. Búsqueda: Bosque Entrada: Evento 29.", "A": [["dpot", 2], ["gold", 3], ["trail"]], "B": [["gold", 1], ["quest", "F", 29, 0]], "y": [331, 371, 469, 640]}, "027-236": {"deck": "city", "intro": "El anciano yace en un jergón de paja, en una habitación fría y sombría. Le cuesta hablar cuando te ve, así que tienes que agacharte y. acercar el oído a sus labios para distinguir las palabras. \"Viejo amigo... Ciento veinte cumpleaños... Envíale mis mejores deseos...”, la respiración del hombre se vuelve más débil con cada palabra.", "optA": "Promete trasladarle sus felicitaciones.", "optB": "Prepara algo para el dolor.", "resA": "El hombre te dice donde puedes encontrar a su amigo.", "resB": "W La vejez es una enfermedad incurable, pero tu infusión permite al anciano pasar sus últimos momentos en paz. Su familia te lo agradece.", "txtA": "Búsqueda: Montaña Entrada: Evento 17.", "txtB": "Obtén 2 de Oro.", "A": [["quest", "M", 17, 0]], "B": [["gold", 2]], "y": [278, 319, 429, 573]}, "027-237": {"deck": "city", "intro": "E abres paso entre la muchedumbre. Oyes gritos de libertad para todos, mezclados con peticiones de enviar a los locos a los hospicios. Le preguntas a una chica que está a tu lado qué está pasando. \"Hace tres días llegaron unos veinte hombres armados”, dice, luchando por hacerse oír por encima del estruendo de la multitud. \"Irrumpieron en la casa del viejo Jori y sacaron a su hija a rastras. Dicen que van a ahorcarla. Esa chica era extraña. Cuando gritaba, las tejas de los tejados temblaban y caían. Pero esto, lo que se ha desatado desde que llegaron esos hombres... Es el infierno.”", "optA": "Desenvaina tu espada y dispersa la manifestación contra los no humanos.", "optB": "Averigua dónde puedes encontrar a la chica", "resA": "Eres la chispa que enciente la confrontación. Tus acciones desatan el infierno.", "resB": "Descubres la ubicación más probable de sus captores.", "txtA": "Quema 1 carta. A continuación, añade 1 de las cartas de Acción reveladas de coste 1 a tu pila de descartes.", "txtB": "Búsqueda: Montaña Entrada: Evento 24.", "A": [["burn", 1], ["gain", 1]], "B": [["quest", "M", 24, 0]], "y": [418, 484, 561, 729]}, "027-238": {"deck": "city", "intro": "bs aldeanos te rodean en una apretada multitud, hablando unos sobre otros. Consigues cal- . marlos lo suficiente para averiguar por qué. están tan agitados. Resulta que un brujo pasó por su pueblo hace un par de semanas. En realidad, todavía está aquí... A dos metros bajo tierra. \"El brujo llegó y aceptó el contrato, pero antes de que pudiera irse, un hombre enorme vino y lo mató en medio del pueblo, ¡lo vi con mis propios ojos! Lo degolló, se llevó su medallón y nos dejó con el problema del monstruo\".", "optA": "Averigua más cosas sobre el asesino del brujo.", "optB": "En tu profesión, la muerte es mucho más probable que la jubilación. Te encoges de hombros y decides echar un vistazo al mercado como planeabas. Pagas 2 de Oro para comprar unos Brazales.", "resA": "Los aldeanos te dicen donde fue el asesino y qué aspecto tenía. Aún tienes una oportunidad de alcanzarlo.", "resB": "El mercader está encantado de venderte un par de brazales reforzados.", "txtA": "Búsqueda: Montaña Entrada: Evento 12.", "txtB": "Roba: Evento 23.", "A": [["quest", "M", 12, 0]], "B": [["event", 28]], "y": [357, 420, 609, 779]}, "027-239": {"deck": "city", "intro": "Agulen tira del dobladillo de tu capa. Un mendigo te pide limosna, carraspeando y tosiendocada dos palabras. Insiste en que posee información que te será útil.", "optA": "“¿Qué puedes decirme gratis?”", "optB": "Regatea el precio de su información.", "resA": "Entre toses, el mendigo menciona haber oído hablar de una bestia esta misma mañana, pero no sabe si el rumor es cierto.", "resB": "El mendigo te habla de una mina en la que trabajó durante muchos años, y que desde entonces ha estado cerrada. “Todo porque los mineros cavaron demasiado hondo y encontraron un...” El resto se pierde entre toses.", "txtA": "Obtén 1 Rastro cualquiera.", "txtB": "Tira un dado: 1-2: Pierde 5 de Oro. 3-4: Pierde 3 de Oro. 5-6: Pierde 2 de Oro. Independientemente de tu tirada, además: Búsqueda: Montaña Entrada: Evento 54.", "A": [["trail"]], "B": [["dice", [[1, 2, [["gold", -5]]], [3, 4, [["gold", -3]]], [5, 6, [["gold", -2]]]]], ["quest", "M", 54, 0]], "y": [168, 210, 332, 472]}, "027-240": {"deck": "city", "intro": "El hombre del mostacho levanta su jarra de cerveza en un brindis, que es seguido inmediatamente por todos los comensales. \"¡A la salud del brujo! \"¡Escuchad, escuchad!\". Ahuyentar a los monstruos que merodeaban por el santuario del Fuego Eterno te ha convertido en un héroe local.", "optA": "Pide la mejor habitación de la posada. Seguro que nadie pondrá objeciones.", "optB": "Admite humildemente que luchar contra monstruos es un trabajo como cualquier otro.", "resA": "Pasas la noche en una cama cómoda. Por la mañana, el posadero te recibe con un desayuno caliente.", "resB": "Se te acercan dos hombres con cruces en sus capas. \"Los sacerdotes del Fuego Eterno agradecen tu sacrificio”, te dicen, entregándote una bolsa.", "txtA": "Durante la Fase III, roba 1 carta adicional. Deja esta carta frente a ti. En lugar de tu próxima Exploración, el jugador a tu derecha te lee Evento 55. Después, descarta esta carta.", "txtB": "Obtén 2 de Oro.", "A": [["p3", 1], ["keep", "next55"]], "B": [["gold", 2]], "y": [218, 282, 431, 657]}, "027-241": {"deck": "city", "intro": "det EVA A o; ER esta ciudad, humanos y elfos viven separados en sus propios distritos. El derramamiento de sangre se respira en el aire, y parece que sólo la. amenaza de una invasión de un ducado vecino impide que los lugareños se maten unos a otros. Al salir del establo, te rodean seis elfos armados con garrotes. \"Debes haberte perdido, humano\".", "optA": "Intenta explicales que no eres para nada humano.", "optB": "Intenta alejarte sin decir una palabra.", "resA": "Tira un dado: 1-3: No consigues convencer a los elfos.", "resB": "Una roca pasa volando cerca de tu cabeza y los elfos te dejan en paz. Aún así, has aprendido una lección. j Aumenta tu nivel de Defensa en 1.", "txtA": "Quema 1 carta. A continuación, añade 1 de las Cartas de Acción reveladas de coste 0 a tu pila de descartes. 4-5: Consigues convencer a algunos elfos. Añade 1 de las Cartas de Acción reveladas de coste 1 a tu pila de descartes. 6: Sólo un elfo sigue con ganas de pelea. Añade 1 de las Cartas de Acción reveladas de coste 2 a tu pila de descartes.", "txtB": "", "A": [["dice", [[1, 3, [["burn", 1], ["gain", 0]]], [4, 5, [["gain", 1]]], [6, 6, [["gain", 2]]]]]], "B": [["attr", "def", 1]], "y": [278, 342, 416, 753]}, "027-242": {"deck": "city", "intro": "se oyen rumores de una chica que se hace llamar la gran maestra local de los dados de póquer. Dicen que sólo pierde una partida al año. Encon-. trarla no es difícil. Saca dos doses y tres treses y te lanza una mirada interrogante.", "optA": "Tira los dados.", "optB": "Llama a la chica tramposa que usa magia.", "resA": "", "resB": "Se levanta en un instante y rápidamente te demuestra que la telequinesis le permite lanzar personas, o brujos, con la misma facilidad que los dados.", "txtA": "Tira los dados de póquer: puedes volver a tirar los dados una vez. Mejor resultado que el de ella: Obtén 5 de Oro. Igual o peor resultado que el de ella: sin efecto.", "txtB": "Aumenta en 1 tu nivel de Atributo más bajo. Tira un dado: 1-2: Descarta todas tus Pociones. 3-4: Reduce tu nivel de Escudo en 1. 5-6: Consigues salir ileso.", "A": [["pokerVs", 5]], "B": [["attr", "low", 1], ["dice", [[1, 2, [["dpot", "all"]]], [3, 4, [["shield", -1]]], [5, 6, []]]]], "y": [219, 261, 372, 515]}, "029-252": {"deck": "wild", "intro": "Mbervas musgo y zarzas bajas que cubren las ruinas, y pisas sobre piedras que una vez fueron altos campanarios. Los elfos construyeron este lugar y luego ellos mismos lo derribaron.", "optA": "Márchate en señal de respeto a la memoria de los elfos.", "optB": "Rebusca en las ruinas.", "resA": "Ó Aunque los elfos se fueron hace tiempo, las trampas que dejaron para los carroñeros siguen funcionando. Pisas una placa de piedra que activa un mecanismo oculto. Una bola de pinchos te golpea dolorosamente, pero consigues encontrar un lugar seguro para descansar.", "resB": "Te sorprende encontrar huellas frescas. Cuando levantas la cabeza, ves una flecha apuntándote a la cara. La espada ya está en tu mano cuando el arquero elfo suelta la cuerda del arco. No puedes resolver esto con palabras y te ves obligado a luchar.", "txtA": "Tira un dado: 1-2: Reduce tu nivel de Escudo en 3 y, durante la Fase III, roba 1 carta adicional. 3-4: Descarta todas tus Pociones y, durante la Fase III, roba 1 carta adicional. 5-6: Reduce tu nivel de Escudo en 1 y, durante la Fase III, roba 1 carta adicional.", "txtB": "Aumenta tu nivel de Especialidad en 1.", "A": [["dice", [[1, 2, [["shield", -3], ["p3", 1]]], [3, 4, [["dpot", "all"], ["p3", 1]]], [5, 6, [["shield", -1], ["p3", 1]]]]]], "B": [["attr", "spe", 1]], "y": [158, 221, 277, 672]}, "029-253": {"deck": "wild", "intro": "Ab casa de la anciana huele a hierbas frescas. Observas un mortero en el mueble de la cocina. La mujer debe haberte confundido con uno de sus nietos. ¿Quién en su sano juicio pediría ayuda a un brujo para recuperar una sartén prestada a un vecino?", "optA": "Pídele amablemente al vecino que te devuelva la sartén.", "optB": "Pídele firmemente al vecino que te devuelva la sartén.", "resA": "En cuanto se fija en tu medallón y tus espadas, el vecino se marcha a su casa y vuelve rápidamente con la sartén. La anciana se muestra agradecida.", "resB": "Entras en la casa del vecino derribando su puerta. El hombre te devuelve la sartén, junto con dos ollas, para disculparse. La anciana se asombra de tu hábil persuasión.", "txtA": "Roba 1 Poción y obtén 1 de Oro.", "txtB": "Roba (hasta) 4 Pociones.", "A": [["pot", 1], ["gold", 1]], "B": [["potUpTo", 4]], "y": [216, 278, 398, 569]}, "029-254": {"deck": "wild", "intro": "PUES huellas ensangrentadas conducen directamente a una cripta. La zona está cubierta de árboles y densas zarzas. La marca dejada por un cuerpo arrastrado por el suelo no deja lugar a' dudas: el hombre al que te han contratado para encontrar no ha venido aquí por su propia voluntad. Tu medallón empieza a vibrar en cuanto cruzas el umbral de la cripta.", "optA": "Entra en la cripta.", "optB": "Déjalo. De todos modos, debe de ser demasiado tarde para encontrar al hombre desaparecido.", "resA": "El enorme ghul carga contra ti desde la oscuridad. La lucha es feroz, y portarás las cicatrices de las garras del monstruo hasta el fin de tus días.", "resB": "Observas que alrededor de la cripta crece fruta de balisa. Es hora de recolectar.", "txtA": "Descarta 2 Pociones y aumenta tu nivel de Combate en 1.", "txtB": "Roba 2 Pociones.", "A": [["dpot", 2], ["attr", "atk", 1]], "B": [["pot", 2]], "y": [306, 348, 508, 706]}, "029-255": {"deck": "wild", "intro": "Para un brujo tan curtido como tú, no es sorprendente encontrarse con un carro atravesado en el camino, bloqueando el paso. Tampoco te asombra presenciar a un hombre lamentándose por ello. Sin embargo, ver un caballo en el tejado de la posada es lo suficientemente desconcertante incluso para ti. ¿Un caballo en un tejado? \"¡Por favor, ayúdenme a sacarlo del tejado! En primer lugar, no tengo ni idea de cómo llegó allí...", "optA": "Ofrécete a ayudar al hombre.", "optB": "Esto es demasiado, incluso para un brujo. Es hora de seguir adelante.", "resA": "Ves a seis bandidos armados salir de su escondite entre los árboles. Debes admitir que los ladrones se han vuelto muy ingeniosos. Tras una rápida escaramuza, te convences de que seguir luchando es inútil, así que rebuscas en tus alforjas y ofreces una solución pacífica.", "resB": "Tomas un rodeo y encuentras un lugar lleno de setas poco comunes.", "txtA": "Tira un dado: 1-2: Pierdes 3 de Oro y aumentas tu nivel de Atributo más bajo en 1. 3-4: Pierdes 2 de Oro y aumentas tu nivel de Atributo más bajo en 1. 5-6: Descarta 1 Poción y aumenta tu nivel de Atributo más baio en 1.", "txtB": "Roba 2 Pociones.", "A": [["dice", [[1, 2, [["gold", -3], ["attr", "low", 1]]], [3, 4, [["gold", -2], ["attr", "low", 1]]], [5, 6, [["dpot", 1], ["attr", "low", 1]]]]]], "B": [["pot", 2]], "y": [296, 335, 419, 785]}, "029-256": {"deck": "wild", "intro": "Bl egidor te invita a su casa. “No soy yo, es la gente del pueblo. Todos piensan que necesitamos un brujo. Algo se ha estado comiendo las gallinas de la gente. Sigo diciéndoles que son sólo los zorros, pero dicen' que es imposible... Pero en realidad tú no cazas zorros, ¿verdad? ¿Eh?”. El hombre se ríe nerviosamente, dirigiendo una mirada furtiva hacia la puerta de su izquierda.", "optA": "Prométele que investigarás.", "optB": "Comprueba qué hay detrás de la puerta.", "resA": "La gente del pueblo tenía razón: ningún depredador natural se estaba comiendo sus aves de corral. Observas cómo un humanoide, con cabeza de zorro, salta una valla y se abalanza sobre las gallinas, comiéndoselas vivas. Es entonces cuando atacas. Al día siguiente, buscas al regidor para informarle de que has acabado con el monstruo, pero no hay rastro de el...", "resB": "El regidor intenta detenerte... pero fracasa. Detrás de la puerta, encuentras sangre y plumas, admite a regañadientes la dolencia que le aqueja, especialmente durante las noches de luna llena. Afortunadamente, puedes ayudarle. .", "txtA": "Añade 1 de las Cartas de Acción reveladas de coste 0 a tu pila de descartes.", "txtB": "Descarta todas tus Pociones y obtén 2 de Oro.", "A": [["gain", 0]], "B": [["dpot", "all"], ["gold", 2]], "y": [271, 313, 383, 691]}, "029-257": {"deck": "wild", "intro": "SEGÚN los libros escritos por hombres doctos, el pueblo lagarto conocido como vrans hace tiempo que abandonó esta parte del continente. Está claro que los dos vrans armados con lanzas a los que te enfrentas nunca han leído esos libros. \"Nos hemos retirado a las tierras salvajes para vivir en paz. ¿Debéis molestarnos incluso aquí? ¡¿Dónde, por todos tus dioses, podemos ir?!\"", "optA": "\"Si saludas a todos a punta de lanza, no me extraña que tengas enemigos.”", "optB": "\"No estoy aquí para molestaros. Encontraré otro camino.\"", "resA": "OA oír tus palabras, el más cercano de los dos hombres lagarto apunta y lanza una estocada de su lanza. Si no fuera por tus agudos reflejos, tu lengua se habría convertido en... una lengua cortada. A duras penas consigues ganar el combate.", "resB": "(813 camino que tomas no es fácil, pero está lleno de valiosas hierbas.", "txtA": "Reduce tu nivel de Escudo en 2, descata 1 Poción y aumenta el nivel de cualquier Atributoen 1.", "txtB": "Roba 2 Pociones.", "A": [["shield", -2], ["dpot", 1], ["attr", "any", 1]], "B": [["pot", 2]], "y": [306, 366, 492, 773]}, "029-258": {"deck": "wild", "intro": "de anciana herborista no mentía sobre este lugar. Está lleno de valiosas plantas, tal y como dijo, pero tu humor se ve pronto empañado por el hecho de que el acónito que buscas crece en una empinada ladera.", "optA": "Intenta subir la ladera.", "optB": "Explora los alrededores y busca algo más cercano al suelo.", "resA": "Ola subida es dura y, en algún momento, una roca resbala bajo tus pies y caes una buena cantidad de metros. La caída es dolorosa y tienes la sensación de que se te ha caído algo de la bolsa.", "resB": "Pocas personas llamarían pasar un buen rato a encontrar huellas dejadas por patas enormes, pero, de nuevo, dicen que sobre gustos no hay nada escrito... especialmente sobre el gusto de un brujo.", "txtA": "Quema 1 carta y roba 2 Pociones.", "txtB": "Obtén 1 Rastro cualquiera.", "A": [["burn", 1], ["pot", 2]], "B": [["trail"]], "y": [196, 239, 382, 553]}, "029-259": {"deck": "wild", "intro": "ibtelbes la magia que resuena en el lago mucho antes de llegar a la orilla. El agua brilla con un. azul celeste y, al desmontar para meditar, notas algo inusual. Una aparición se posa sobre la superficie del agua, a pocos metros de ti. Observas cómo el fantasma aparece y desaparece, acercándose un poco más cada vez que reaparece.", "optA": "Deja que hable tu espada.", "optB": "Haz caso a la voz de la razón y aléjate.", "resA": "La aparición es demasiado poderosa para intentar luchar contra ella. Tu espada la atraviesa sin causar daño, cortando nada más que aire. Entonces un fuerte dolor atraviesa tu cuerpo. Cuando vuelves en ti, te encuentras solo en la orilla del lago.", "resB": "No se puede vencer a todos los oponentes, y a veces la prudencia es mejor opción que el valor. Se puede aprender una valiosa lección, incluso de la retirada.", "txtA": "Reduce tu nivel de Escudo en 1 y aumenta el nivel de cualquier Atributo en 1.", "txtB": "Aumenta tu nivel de Defensa en 1.", "A": [["shield", -1], ["attr", "any", 1]], "B": [["attr", "def", 1]], "y": [251, 290, 398, 654]}, "029-260": {"deck": "wild", "intro": "El anciano sentado en la carreta tiene el pelo largo y blanco salpicado de zonas calvas. Te ob-. serva atentamente, moviendo las manos con aprensión. Sientes que tu medallón vibra ligera-. mente, pero no puedes ver lo que hay en la carreta del anciano. Cuando habla, su voz sibilante te recuerda al siseo de una serpiente. \"Un brujosssh, ¿eh? ¿Me acompañasssh?\"", "optA": "Salta a la carreta.", "optB": "Confía en tu intuición y ataca al hombre.", "resA": "El anciano es sin duda excéntrico, y tal vez esté un poco trastornado, pero es completamente inofensivo. El contenido de las cajas que hace vibrar tu medallón seguirá siendo un misterio para ti para siempre. Muévete a un Lugar conectado. A continuación, puedes realizar una Acción de Lugar.", "resB": "La Señal que usas, con la esperanza de desarmarlo, derriba al anciano de su carreta. Cae de mala manera y se golpea la cabeza contra una roca del camino... la sangre salpica por todas partes. Te deshaces de su cuerpo y luego rebuscas entre las cajas.", "txtA": "", "txtB": "Roba (hasta) 4 Pociones y, durante la Fase III, roba 1 carta menos.", "A": [["moveAdj"]], "B": [["potUpTo", 4], ["p3", -1]], "y": [308, 347, 419, 645]}, "031-270": {"deck": "wild", "intro": "355% AUCODELES LIATIFEITEPPOA ES TIL + ATA Te encuentras en la única posada de la zona, ya abarrotada de clientes. No quedan mesas libres, pero aún se puede encontrar un asiento.", "optA": "Únete al grupo de serios soldados.", "optB": "Únete al grupo de ruidosos enanos.", "resA": "En tu profesión, siempre es bueno intercambiar experiencias con hombres que tratan la guerra como una ocupación.", "resB": "El alcohol enano les suelta la lengua y te hablan de los peligros que te esperan en el camino y de cómo afrontarlos.", "txtA": "Aumenta el nivel de cualquier Atributo en 1.", "txtB": "Obtén 1 Rastro cualquiera y quema 1 carta. A continuación, añade 1 de las 6 Cartas de Acción reveladas a tu pila de descartes, y durante la Fase III, roba 1 carta menos.", "A": [["attr", "any", 1]], "B": [["trail"], ["burn", 1], ["gain", "any"], ["p3", -1]], "y": [141, 184, 292, 434]}, "031-271": {"deck": "wild", "intro": "SúER la naturaleza, desprovista de toda alma viviente, te encuentras con un ermitaño. Los ojos: del hombre están cubiertos de sombras, y su. larga y desaliñada barba confiere a sus rasgos un aspecto enloquecido. \"Por favor, déjame ver mi reflejo en el filo de tu espada\", te pide con voz ronca.", "optA": "Dale tu espada.", "optB": "\"Nunca doy mi espada a otro. ¿Has visto algo sospechoso en esta zona?\"", "resA": "El ermitaño mira su reflejo y empieza a gritar: \"¡Los veo! Nunca se han ido\". Te ataca con la fuerza de un poseso. Al cabo de un momento, recupera el control. \"Los espíritus de aquellos a los que he defraudado... aún me persiguen. Los veo en cada reflejo. Tengo pociones y hierbas, pero no ayudan. Puedes quedártelas.\"", "resB": "Sigues las indicaciones del ermitaño hasta un nido de arpías. Tomas por sorpresa a las criaturas y las despachas sin problemas.", "txtA": "Reduce tu nivel de Especialidad en 1 y roba 2 Pociones.", "txtB": "Descarta 2 Pociones y aumenta tu nivel de Combate en 1.", "A": [["attr", "spe", -1], ["pot", 2]], "B": [["dpot", 2], ["attr", "atk", 1]], "y": [254, 297, 434, 717]}, "031-272": {"deck": "wild", "intro": "Wihtras en la cabaña a la que has sido citado e inmediatamente te sorprende el hedor a carne podrida. Un simple vistazo al muchacho pálido y sudoroso te dice que está en muy mal estado. La sangre empapa el vendaje improvisado de su pecho. “Esa cosa lo atrapó en los campos hace un momento\", se lamenta la madre del niño. \"¡que los dioses nos ayuden!\"", "optA": "Intenta curar las heridas del niño.", "optB": "Ve tras el monstruo.", "resA": "Los elixires que usan los brujos por sus propiedades curativas y alucinógenas pueden ser demasiado peligrosos para los humanos. Su fiebre ha bajado, el niño se ha dormido, pero es imposible saber si ha perdido la cabeza hasta que se despierte de nuevo. Su madre agradece tu intento de ayuda.", "resB": "El barghest sigue en la zona, atraído por el olor a sangre recién derramada. Pero para ti, un solo monstruo apenas es un desafío.", "txtA": "Descarta todas tus Pociones y obtén 3 de Oro.", "txtB": "Quema 1 carta. A continuación, añade 1 de las Cartas de Acción reveladas de coste 2 a tu pila de descartes. Además, durante la Fase III, roba 1 carta menos. DI II ir cal nad, Je OA TOMIIAA CILA slo!", "A": [["dpot", "all"], ["gold", 3]], "B": [["burn", 1], ["gain", 2], ["p3", -1]], "y": [274, 317, 403, 660]}, "031-273": {"deck": "wild", "intro": "El camino está bloqueado por un árbol caído. Aunque tu caballo puede sortear fácilmente el. roble derrumbado, el mercader con el que te en-. cuentras queda abatido por el incidente. Se lamenta de no poder llegar a tiempo al mercado y de que por ese motivo su familia se muera de hambre. \"¿Tal vez te gustaría ver lo que tengo en el carro? Nudillos de latón, pernos de ballesta, pieles curtidos... ¡todo barato y de buena calidad!\"", "optA": "Ayuda al mercader a mover el árbol caido.", "optB": "Paga 1 de Oro para comprar los nudillos de latón.", "resA": "El hombre se muestra agradecido y espera que ahora pueda llegar a tiempo al mercado. Como muestra de gratitud, te regala una armadura de cota de malla ligeramente usada.", "resB": "No es un arma que pueda tumbar a un gólem de piedra, pero te ayudará a romper algunos dientes en caso de apuro.", "txtA": "Aumenta tu nivel de Defensa en 1 y, durante la Fase III, roba 1 carta menos.", "txtB": "Pierde 1 de Oro y roba Evento 15.", "A": [["attr", "def", 1], ["p3", -1]], "B": [["gold", -1], ["event", 15]], "y": [309, 352, 479, 675]}, "031-274": {"deck": "wild", "intro": "POCO después de tu llegada, el poblado recibe la visita de una compañía de circo. La gente empieza a hablar del comefuegos, del enano que: rompe herraduras y de la mujer cuya barba le llega a las rodillas. El mundo parece haber olvidado a los monstruos, y te das cuenta de que aquí no encontrarás trabajos interesantes. La carpa del circo se levanta cerca de tu posada.", "optA": "Ve a ver el espectáculo.", "optB": "Habla con el director del circo.", "resA": "son tiempos difíciles, y un poco de entretenimiento puede venir muy bien. Incluso has conseguido aprender algo observando a los equilibristas.", "resB": "El hombre corpulento de mejillas sonrosadas se frota las manos al verte. \"¡Un brujo! Justo lo que necesitábamos. ¿Quieres ser la estrella de nuestro espectáculo la próxima vez que nos veamos?\" Búsqueda: Montaña Entrada: Evento 40.", "txtA": "Pierde 1 de Oro y aumenta tu nivel de Combate en 1.", "txtB": "", "A": [["gold", -1], ["attr", "atk", 1]], "B": [["quest", "M", 40, 0]], "y": [278, 322, 429, 627]}, "031-275": {"deck": "wild", "intro": "Wlientras guías a tu caballo hasta el establo, el dueño te pide conversar un momento. Un poco nervioso, te habla de su primo, el regidor del pueblo. Ha estado teniendo problemas con los. bandidos que extorsionan al pueblo para lucrarse. Pero, si apareciera un brujo, especialmente uno con una mirada tan dura como la tuya, los bastardos seguramente entrarían en razón...", "optA": "Prométele que te reunirás con el regidor.", "optB": "Niégate. Tú cazas monstruos, no hombres, e independientemente de eso, estás aquí para que atiendan a tu caballo.", "resA": "El caballerizo te da las gracias y promete que su primo te pagará generosamente por tu ayuda.", "resB": "W La cara del caballerizo se ensombrece, pero atiende a tu caballo con toda diligencia. Para cuando vuelves al camino, tu montura está totalmente descansada.", "txtA": "Búsqueda: Agua Entrada: Evento 41.", "txtB": "Pierdes 1 de Oro y te mueves a un Lugar conectado, luego puedes realizar una Acción de Lugar.", "A": [["quest", "W", 41, 0]], "B": [["gold", -1], ["moveAdj"]], "y": [304, 347, 506, 677]}, "031-276": {"deck": "wild", "intro": "iientras amarras tu caballo a una valla frente a una posada, la mujer del posadero se acerca con un cubo de agua fresca y una hogaza de pan seco. \"Aquí cuidamos de todos nuestros huéspedes”, explica, acariciando al caballo y colocando el cubo bajo su hocico. \"Tienes un caballo precioso. Mi hermana los cría. ¿Por qué no vas a verla? Quizá puedas hacer un trato.\"", "optA": "Pídele sólo pasar la noche. Tú y tu caballo tenéis un vínculo más fuerte que el dinero.", "optB": "Pregunta dónde puedes encontrar a la hermana de la mujer.", "resA": "DA los huéspedes humanos se les trata incluso mejor que a los animales. La comida huele y sabe de maravilla.", "resB": "Te enteras de la ubicación de la granja de caballos. La dueña podría estar dispuesta a negociar contigo por una nueva montura. Búsqueda: Bosque Entrada: Evento 16.", "txtA": "Pierde 2 de Oro y, durante la Fase III, roba 1 carta adicional.", "txtB": "", "A": [["gold", -2], ["p3", 1]], "B": [["quest", "F", 16, 0]], "y": [304, 368, 507, 675]}, "031-277": {"deck": "wild", "intro": "e visión de un brujo muerto basta para conmover incluso el corazón de alguien aparentemente desprovisto de emociones... sobre todo cuando el fallecido es un brujo de tu propia escuela. Cavas una tumba en medio de un pequeño claro del bosque y decides no dejar su muerte sin castigo.", "optA": "Coge el medallón y la espada del brujo caído para exponerlos en tu escuela en un lugar de honor.", "optB": "intenta averiguar qué mató a tu amigo.", "resA": "Gracias a tus actos, la memoria de tu amigo y compañero no caerá en el olvido.", "resB": "Las heridas y huellas del brujo, que están esparcidas por la zona, te dicen mucho sobre el culpable, el brujo murió luchando contra una bestia.", "txtA": "Búsqueda: Tu propia Escuela Entrada: Evento 42.", "txtB": "Obtén 1 Rastro cualquiera y añade 1 de las Cartas de Acción reveladas de coste 0 a tu pila de descartes.", "A": [["quest", "own", 42, 0]], "B": [["trail"], ["gain", 0]], "y": [254, 348, 477, 620]}, "031-278": {"deck": "wild", "intro": "ES lugareños hablan de un extraño ermitaño que vive en los bosques cercanos al pueblo. Dicen que su mente es poco más que la de un. ghul, y que lo único que hace en todo el día es sentarse y lamentarse. Visitas al anciano arrugado, que te cuenta historias de sus viajes pasados a lejanos Lugares de Poder. Ahora que la vejez le ha alcanzado, le queda poca vida y sólo fatiga, añoranza y setas alucinógenas.", "optA": "Aprende más sobre setas y alquimia.", "optB": "Aprende más sobre Lugares de Poder.", "resA": "Aunque agota algunos de tus suministros, las enseñanzas del anciano resultan valiosas.", "resB": "El Anciano habla de las tierras que visitó una vez y de los obeliscos mágicos que encontró allí. Búsqueda: Bosque Entrada: Evento 43.", "txtA": "Descarta todas tus Pociones y aumenta tu nivel de Alquimia en 1.", "txtB": "", "A": [["dpot", "all"], ["attr", "alc", 1]], "B": [["quest", "F", 43, 0]], "y": [334, 378, 477, 619]}, "033-288": {"deck": "wild", "intro": "Blcen que donde hay una masa de agua, hay piratas. Si eso es cierto, el barco accidentado que acabas de encontrar en la orilla del río debe de haber estado flotando gracias a la fuerza de voluntad de su tripulación pirata. Parece que la sábana llena de agujeros con una calavera chapucera que sirve de bandera es el elemento más sólido de toda la estructura del barco. No hay supervivientes del accidente en los alrededores.", "optA": "Busca entre los restos.", "optB": "Informa a los lugareños de los restos del naufragio.", "resA": "Encuentras un mapa de la zona de Glenmore con una X dibujada a mano. Puede que tengas una idea de lo que significa la X.", "resB": "enterarse de la noticia, los aldeanos se reúnen frente a la casa del regidor. Armados con guadañas y horcas, están preparados por si vuelven los piratas. Como muestra de gratitud, te pagan con monedas y te ofrecen alojamiento.", "txtA": "Búsqueda: 12. Glenmore Entrada: Evento 44.", "txtB": "Obtén 1 de Oro y, durante la Fase III, roba 1 carta adicional.", "A": [["quest", 12, 44, 0]], "B": [["gold", 1], ["p3", 1]], "y": [305, 349, 477, 647]}, "033-289": {"deck": "wild", "intro": "MiNtuentras huellas ensangrentadas que te llevan hasta una chica que está postrada junto a un árbol. Está pálida y el dobladillo de su vestido. está empapado de sangre. \"Estaba caminando... Debo ir a... Encontrar a mi hermano. Pronto zarpará hacia el archipiélago... La visión de la abuela... No debe ir...\"", "optA": "Averigua qué causó sus heridas.", "optB": "Ofrécete para encontrar a su hermano.", "resA": "La chica no sabe nada de monstruos, pero la herida sangrante de su pantorrilla te resulta familiar.", "resB": "(813 barco va a zarpar pronto, pero aún hay tiempo. Buscar en el puerto consume mucha de tu energía.", "txtA": "Obtén 1 Rastro cualquiera y descarta 1 Poción.", "txtB": "Búsqueda: Agua Entrada: Evento 45.", "A": [["trail"], ["dpot", 1]], "B": [["quest", "W", 45, 0]], "y": [247, 291, 437, 577]}, "033-290": {"deck": "wild", "intro": "ets 4 TE TIA. AA e encuentras con un vagabundo en el camino. \"¡Eres un regalo del cielo, brujo! Acabo de: marcharme del puente donde siete sinvergúenzas se pusieron a cobrar a los viajeros un peaje que no puedo pagar. ¡Si estuvieras conmigo, no se atreverían! Sin ti... Mis nietos no volverán a ver a su abuelo...\"", "optA": "Acompaña al hombre hasta el puente.", "optB": "Lanza una moneda a un mendigo, oh valle de la abundancia...", "resA": "El vagabundo sugiere que cobres un pequeño precio a quien esté dispuesto a cruzar en compañía de un brujo. Sigue siendo más barato que el peaje, y ambos podréis ganar un dinerillo.", "resB": "El hombre agradece tu limosna. Antes de que tengas tiempo de reaccionar, te agarra de la mano y del codo. Ves un brillo en sus ojos y sientes que te recorre un escalofrío.", "txtA": "Búsqueda: Agua Entrada: Evento 46.", "txtB": "Pierdes 1 de Oro y aumentas en 1 tu nivel de Atributo más bajo.", "A": [["quest", "W", 46, 0]], "B": [["gold", -1], ["attr", "low", 1]], "y": [247, 291, 437, 635]}, "033-291": {"deck": "wild", "intro": "ico más frío que en el culo de un gigante de hielo, pero uno no rechaza hacerle un favor a. una hechicera. No puedes quitarte de la cabeza la impresión de que su petición es poco más que una broma de mal gusto. Cera de oreja de trol de hielo, ¿en serio? ¿Eso es lo que preocupa a la Logia?. Llegas a la guarida en el punto más alto del terreno. La criatura está dormida.", "optA": "Despierta al trol y enfréntate a él en un com bate honorable.", "optB": "intenta alcanzar la oreja del trol sin despertarlo.", "resA": "Lo que pretendías que fuera un combate honorable se convirtió rápidamente en una huida deshonrosa. El trol se ha dado cuenta de que le llevas ventaja y ha rodado desde la cima de la montaña a la velocidad de una avalancha.", "resB": "Tienes éxito. El cerumen es pegajoso y maloliente, pero es una pequeñez que soportar en aras de la amistad. Todo lo que tienes que hacer ahora es entregarlo... Búsqueda: 5. Cidaris Ls Entrada: Evento 47.", "txtA": "Reduce tu nivel de Escudo en 1 y quema 1 carta. A continuación, añade 1 de las 6 Cartas de Acción reveladas a tu pila de descartes.", "txtB": "", "A": [["shield", -1], ["burn", 1], ["gain", "any"]], "B": [["quest", 5, 47, 0]], "y": [304, 368, 446, 700]}, "033-292": {"deck": "wild", "intro": "as desterrar a un fantasma del lugar, visitas al regidor para recoger tu recompensa. El regidor te espera con un cerdo asado y la mejor bebida. ya preparada. Se dirige a ti antes de que tengas tiempo de mencionar el pago. \"Algo ha estado rondando las alcantarillas bajo el sótano de la casa de mi primo lejano. ¿Tienes algún consejo de experto?”", "optA": "Investiga las alcantarillas esperando una recompensa aún mayor.", "optB": "Has venido aquí por dinero, no para dar con: sejos.", "resA": "Examinas las alcantarillas y descubres que las paredes están cubiertas de cieno y que huele muy mal. Sumido en tus pensamientos, examinas las pruebas más de cerca y te das cuenta de que lo que había aquí hace tiempo que desapareció. Pero siempre puede volver, así que es mejor analizar la situación en su origen.", "resB": "\"¿Quieres mi consejo? Que no te coman. Y paga o tu brujo por sus servicios.\"", "txtA": "Búsqueda: Agua Entrada: Evento 48.", "txtB": "Obtén 2 de Oro.", "A": [["quest", "W", 48, 0]], "B": [["gold", 2]], "y": [276, 340, 475, 757]}, "033-293": {"deck": "wild", "intro": "Te detienes en la entrada de una cueva. Se rumorea que un monstruo la ha convertido en su guarida.", "optA": "Atrae al monstruo a la superficie.", "optB": "Combate en el interior de la cueva utilizandi el factor sorpresa.", "resA": "Un enorme golem carga contra ti y la lucha es encarnizada. Finalmente consigues forzar al monstruo a retroceder dentro de la cueva, entonces utilizas una Señal para derrumbar sobre su cabeza pesadas rocas.", "resB": "La cueva está llena de un hedor repugnante que irrita tus fosas nasales desde que das el primer paso. Dentro encuentras un golem que te ataca en cuanto te acercas. A duras penas consigues derrotar a la criatura, y tu sensible sentido del olfato se resiente de los olores que desprende. En el suelo, junto al monstruo caído, encuentras un esqueleto, en cuyo dedo hay un anillo con un blasón que conoces muy bien. Decides devolver el anillo a la familia.", "txtA": "Aumentas tu nivel de Defensa, reduce tu nivel de Escudo en 1 y descartas 1 Poción.", "txtB": "Reduce tu nivel de Alquimia en 1. Búsqueda: Agua Entrada: Evento 6.", "A": [["attr", "def", 1], ["shield", -1], ["dpot", 1]], "B": [["attr", "alc", -1], ["quest", "W", 6, 0]], "y": [130, 169, 248, 475]}, "033-294": {"deck": "wild", "intro": "Has oído noticias de un colihendido que aterroriza a los pastores de la zona. De camino al lugar, observas una criatura con escamas que planea. sobre una de las colinas. Al acercarte, observas extrañas marcas talladas en la roca. Tu medallón empieza a vibrar.", "optA": "Lucha contra el colihendido.", "optB": "Examina las misteriosas marcas.", "resA": "El monstruo se abalanza sobre ti cuando llegas a la cima de la colina. A duras penas consigues esquivar un barrido de su cola, pero el colinendido no puede evitar el filo mortífero de tu espada.", "resB": "La magia no es tu especialidad, pero estas marcas te resultan familiares. Tu intuición te dice que podrían estar relacionadas con portales e invocaciones. Conoces a un mago especialista en este campo y decides preguntarle. Mientras estudias las marcas, el colihendido ve una oportunidad. Te ataca, hiriéndote, y se va volando con lo que parece una sonrisa en la cara.", "txtA": "Reduce tu nivel de Escudo en 2 y aumenta tu nivel de Combate en 1.", "txtB": "Reduce tu nivel de Especialidad en 1. Búsqueda: Agua Entrada: Evento 9.", "A": [["shield", -2], ["attr", "atk", 1]], "B": [["attr", "spe", -1], ["quest", "W", 9, 0]], "y": [218, 258, 334, 561]}, "033-295": {"deck": "wild", "intro": "El cadáver de la mantícora yace a tus pies. Después de un momento, consigues recuperar de nuevo el aliento. Parece que no has sufrido. heridas graves.", "optA": "Aprovecha el calor que bulle en tus músculos para empezar a entrenar.", "optB": "6 Arranca el aguijón de la mantícora.", "resA": "Hacía tiempo que no te entrenabas tan bien. Tu espada se convierte en una extensión de tu brazo y tu cuerpo se mueve más rápido que tus pensamientos.", "resB": "El aguijón es un ingrediente necesario en el Juicio de las Hierbas, por lo tanto es muy valorado por las escuelas de brujos. Búsqueda: Escuela propia o de otro jugador Entrada: Evento 10.", "txtA": "Aumenta tu nivel de Combate en 1.", "txtB": "", "A": [["attr", "atk", 1]], "B": [["quest", "school", 10, 0]], "y": [169, 231, 334, 506]}, "033-296": {"deck": "wild", "intro": "e reúnes con el alcalde en un edificio: Parece que su ego es lo único que impide que se estrelle contra el suelo. Por un momento, mira en silencio el cadáver de un sumergido que has arrojado a sus pies. \"Vine aquí hace doce años. Tuve que dejar a mi mujer. Ella no entendía mi misión, mi necesidad de reconstruir esta ciudad... No vas a cobrarme, ¿verdad? Puse cada centavo que me sobró en este lugar...”", "optA": "Sugiérele que a un brujo se le puede pagar con algo más que oro.", "optB": "intimida al hombre.", "resA": "Invocas la Ley de la Sorpresa y el hombre se queda inmóvil, traga saliva y acepta.", "resB": "Todo lo que necesitas hacer es acercarte amenazadoramente al alcalde para obligarle a sacar su bolsa.", "txtA": "Búsqueda: Agua Entrada: Evento 22.", "txtB": "Obtén 2 de Oro.", "A": [["quest", "W", 22, 0]], "B": [["gold", 2]], "y": [339, 401, 512, 655]}, "035-306": {"deck": "wild", "intro": "sí pasas otro par de horas en la silla, tus hemorroides. Tendrán sus propias hemorroides. Maldices en voz baja aprietas los dientes para llegar. al linde del bosque. Al borde de un grupo de árboles ves una choza, fuera, un hombre corpulento está cortando leña. Se da cuenta de tu llegada. \"Buscando un lugar para pasar la noche, ¿eh? Pues resulta que estoy buscando un compañero de borrachera. Hace tiempo que no tengo la oportunidad de beber en compañía. Hagamos un trato: si puedes seguirme el ritmo con la bebida, compartiré parte de mis provisiones.”", "optA": "Acepta la propuesta.", "optB": "Tu agudeza sobrenatural es demasiado valiosa para perderla por culpa de una bebida cuestionable, así que acampas en el bosque.", "resA": "El aguardiente te mantiene caliente.", "resB": "Por la mañana encuentras nuevos rastros sospechosos en la zona.", "txtA": "Tira un dado: 1-3: Obtén 1 Rastro cualquiera y, durante la Fase III, roba 1 carta adicional. 4-5: Obtén 1 Rastro cualquiera y, durante la Fase III, roba 2 cartas adicionales. 6: Durante la Fase III, roba 3 cartas adicionales.", "txtB": "Obtén 1 Rastro cualquiera.", "A": [["dice", [[1, 3, [["trail"], ["p3", 1]]], [4, 5, [["trail"], ["p3", 2]]], [6, 6, [["p3", 3]]]]]], "B": [["trail"]], "y": [383, 428, 550, 777]}, "035-307": {"deck": "wild", "intro": "El granjero está sentado, recostado contra el poste de un espantapájaros, gime de dolor. Cuando te acercas, te muestra lentamente una. fea herida que tiene en el costado.", "optA": "Ayúdale a vendar la herida.", "optB": "Sigue las huellas de la bestia que hirió al granjero.", "resA": "La herida supura algo horrible y sabes que ayudar al hombre no será fácil. Mientras trabajas, te habla de la hija de un gobernante de la zona, de la que se rumorea que está maldita. \"Eres curandero, ¿no? Tal vez puedas ayudarla a ella también.\"", "resB": "Encuentras las huellas con facilidad.", "txtA": "Tira un dado: 1-2: Descarta 3 Pociones. 3-4: Descarta 2 Pociones. 5-6: Vendas su herida facilmente. Búsqueda: Agua Entrada: Evento 8.", "txtB": "Obtén 1 Rastro cualquiera.", "A": [["dice", [[1, 2, [["dpot", 3]]], [3, 4, [["dpot", 2]]], [5, 6, []]]], ["quest", "W", 8, 0]], "B": [["trail"]], "y": [164, 209, 332, 697]}, "035-308": {"deck": "wild", "intro": "de aldea a la que has llegado ha vivido tiempos mejores. Una mujer desaliñada cuelga la ropa delante de su casa y te informa de un problema. que aqueja a los aldeanos. \"Yo, mi marido e incluso nuestros hijos sólo bebemos del pozo\", dice. \"Todos los que beben del arroyo han muerto de una manera horrible.”", "optA": "Examina los cuerpos.", "optB": "Investiga las orillas del arroyo.", "resA": "Una inspección de los cadáveres frescos no deja dudas, el arroyo ha sido contaminado con veneno cadavérico. \"Los demás podrían pensar que he perdido la razón, pero yo me quedo con el agua del pozo, muchas gracias”, dice la mujer.", "resB": "Los nekkers han construido un nido bajo un puente cercano y los cadáveres de los viajeros están llenando el arroyo del veneno que se filtra de sus cuerpos. A duras penas consigues ahuyentar a los monstruos. Los aldeanos te agradecen tu ayuda. \"Mi hermano dejó el pueblo para alistarse en el ejército cuando aún éramos niños\", dice el marido de una de las lavanderas. \"Si te lo encuentras en tu viajes, ¿le pedirías que volviera? Aquí quedamos muy pocos\".", "txtA": "Aumenta tu nivel de Alquimia en 1.", "txtB": "Reduce tu nivel de Defensa en 1. Búsqueda: Agua Entrada: Evento 3.", "A": [["attr", "alc", 1]], "B": [["attr", "def", -1], ["quest", "W", 3, 0]], "y": [244, 282, 331, 501]}, "035-309": {"deck": "wild", "intro": "da aldeanos sospechaban que el chico podría tener habilidades y te llamaron para asegurarse. Cuando su enorme poder casi te lanza contra la. pared, no te cabe duda de que los aldeanos tenían razón.", "optA": "Asegúrate de que la presencia de una Fuente no ha atraído a otras criaturas mágicas.", "optB": "Entrega el niño a los magos.", "resA": "No estás lejos de la aldea cuando tu medallón empieza a vibrar. En la rama de un árbol, observas unas marcas de garras recientes.", "resB": "Si realmente es una Fuente, dejar al chico en la aldea seria desperdiciar un singular talento. Búsqueda: 4. Ban Ard Entrada: Evento 4.", "txtA": "Obtén 1 Rastro cualquiera y roba 1 Poción.", "txtB": "", "A": [["trail"], ["pot", 1]], "B": [["quest", 4, 4, 0]], "y": [194, 287, 379, 521]}, "035-310": {"deck": "wild", "intro": "Ahtes de cruzar el puente, observas una larga hilera de carros y jinetes. Hablas con un soldado que vigila el puente. \"Si vas a Cintra, no puedes. pasar. Este es un camino sin retorno para todos. Bueno... casi para todos. En tu caso... podemos hacer una excepción.\"", "optA": "Cruza el puente.", "optB": "Elige otro camino.", "resA": "Ves los huesos de los muertos y sus armas esparcidas a lo largo del camino... ¿Qué monstruo es capaz de derrotar a tantos hombres armados?", "resB": "Tomas la ruta más larga, y pierdes algo de tiempo, pero consigues reponer tu provisión de hierbas.", "txtA": "Búsqueda: 9. Cintra Entrada: Evento 7.", "txtB": "Roba (hasta) 4 Pociones y, durante la Fase III, roba 1 carta menos.", "A": [["quest", 9, 7, 0]], "B": [["potUpTo", 4], ["p3", -1]], "y": [224, 267, 379, 577]}, "035-311": {"deck": "wild", "intro": "CIIETSITITEPTIID UTE — TCM Weil ahochecer te sorprende en plena naturaleza y las huellas que has estado siguiendo durante las últimas horas se detienen frente a ti. El sol se pone y la zona se sumerge en una oscuridad impenetrable para un ojo común. Sientes que seguir adelante puede ser peligroso. Es hora de descansar, pero al mirar a tu alrededor no estás seguro de poder hacer un campamento.", "optA": "trata de montar un campamento.", "optB": "Intenta encontrar el asentamiento más cercano", "resA": "", "resB": "Llegas a la aldea tras un largo y agotador viaje, pero el destino recompensa tus esfuerzos. Por la mañana, los aldeanos te piden ayuda para recolectar hierbas medicinales y setas, y están encantados de pagarte.", "txtA": "Tira un dado: 1-2: Durante la Fase III, roba 1 carta adicional. 3-4: Durante la Fase III, roba 2 cartas adicionales. 5-6: Obtén 1 Rastro cualquiera y durante la Fase III, roba 1 carta adicional.", "txtB": "Obtén 2 de Oro.", "A": [["dice", [[1, 2, [["p3", 1]]], [3, 4, [["p3", 2]]], [5, 6, [["trail"], ["p3", 1]]]]]], "B": [["gold", 2]], "y": [279, 322, 452, 624]}, "035-312": {"deck": "wild", "intro": "luonstruo que te han contratado para matar te mira con ojos muertos. Sobre el cadáver se alza un hombre de brillante armadura, con una espada ensangrentada en la mano. Te fijas en la cruz de su coraza. \"Soy Edgar de Spota, un caballero del culto del Fuego Eterno en una cruzada contra todas las abominaciones. Vosot
