ros, brujos, sois una reliquia del pasado.”", "optA": "\"¿Una reliquia del pasado? Suena como tu religión.\"", "optB": "\"Ambos matamos monstruos, así que estamos en el mismo bando”.", "resA": "La cara de Edgar se enrojece bajo su yelmo. Se marcha rápidamente, dejando atrás el cadáver. Al menos aún te pagarán.", "resB": "El caballero sonrie. \"Tal vez no todos los brujos son tan estúpidos como los sacerdotes nos dicen. Destruir la inmundicia es nuestra vocación común. ¿Me dejas unirme a ti?\"", "txtA": "Obtén 2 de Oro. Búsqueda: 6. Novigrad Entrada: Evento 49.", "txtB": "Roba Evento 50.", "A": [["gold", 2], ["quest", 6, 49, 0]], "B": [["event", 50]], "y": [304, 369, 499, 697]}, "035-313": {"deck": "wild", "intro": "pts TE TV AA. AAA O: tres jinetes cabalgan en columna, uno tras otro, y el jinete del centro tiene las manos atadas con una gruesa cuerda. No puede tener más de. dieciséis años. Cuando pasas junto a los jinetes. por el sendero, el chico te grita: \"¡Ayúdame, brujo! Tú matas monstruos, ¿verdad? ¿Cómo llamas a los hombres que secuestran al hijo de un barón para pedir rescate?”.", "optA": "\"Emprendedores. Yo los llamo emprendedores\".", "optB": "Ú Ataca a la escolta armada.", "resA": "La escolta del prisionero estalla en carcajadas. El hombre a la cabeza de la columna te guiña un ojo mientras te lanza una pequeña bolsa.", "resB": "El primer jinete muere rápidamente, pero el otro resulta más problemático. El chico te da las gracias mientras cortas sus ataduras. \"Dile a mi padre que soy libre. Me esconderé por la zona y esperaré a sus hombres.”", "txtA": "Obtén 3 de Oro.", "txtB": "Reduce tu nivel de Escudo en 1 y descarta 1 Poción. de Búsqueda: Montaña Entrada: Evento 52.", "A": [["gold", 3]], "B": [["shield", -1], ["dpot", 1], ["quest", "M", 52, 0]], "y": [277, 342, 429, 599]}, "035-314": {"deck": "wild", "intro": "Veces los monstruos no son lo que más miedo da. Al cruzar un amplio claro te encuentras con un hombre cuyo semblante te deja sin habla. Se parece exactamente a ti... si alguna vez tienes la oportunidad de envejecer.", "optA": "Algunas cosas es mejor no conocerlas. Corre a tu caballo y sal de allí.", "optB": "\"Creo que deberíamos hablar.\"", "resA": "Te frenas sólo cuando tu caballo empieza a jadear. Es entonces cuando te das cuenta de que, mientras huías de tu pasado, has perdido algo importante para ti en el presente.", "resB": "No muchos brujos tienen la oportunidad de conocer a sus padres, pero cuando se te pasa el primer susto, te das cuenta de que no sientes nada. No hay arrepentimiento, ni ira, ni alegría. Debes admitir, sin embargo, que tu padre cocina una perdiz malísima.", "txtA": "Quema 1 carta. Búsqueda: Tu propia Escuela Entrada: Evento 53.", "txtB": "Durante la Fase III, roba 1 carta adicional.", "A": [["burn", 1], ["quest", "own", 53, 0]], "B": [["p3", 1]], "y": [195, 260, 388, 616]}};
const EVENTS={"1": {"img": "037-324", "ops": [["keep", "ballesta1"]]}, "2": {"img": "037-325", "intro": "WbEbes admitirlo: los bastardos tienen estilo. Los elevados interiores de la sede del Consejo de Magos causan una gran impresión, mientras la. luz que se filtra por las ventanas baila sobre la decoración dorada de las paredes.", "optA": "Monta una escena sobre el mago que te ha estafado.", "optB": "Explícale con calma tus asuntos.", "resA": "La mujer te escucha sin perder la compostura y, una vez que has terminado, te entrega unas monedas y señala la puerta con un gesto lánguiObtén 3 de Oro.", "resB": "Su semblante apagado se vuelve más comprensivo. Recibes una compensación por tus molestias, así como algo de información útil.", "txtA": "", "txtB": "Roba (hasta) 4 Pociones y obtén 1 Rastro cualquiera.", "A": [["gold", 3]], "B": [["potUpTo", 4], ["trail"]], "y": [198, 263, 390, 562]}, "3": {"img": "037-326", "intro": "IIItas la guarnición para buscar información sobre el hermano de un hombre del pueblo moribundo. Es fácil de encontrar, sin embargo, al escuchar la solicitud de su familia, niega con la' cabeza “Soy médico y sigo al ejército. Puedo salvar más vidas aquí que en el poblado. Debo quedarme aquí, pero comprendo que buscarme ha debido ser un esfuerzo, ¿cómo puedo agradecértelo?”", "optA": "Pide ingredientes para pociones.", "optB": "Pide medicamentos", "resA": "El hombre está encantado de compartir sus suministros. Ignora tu límite de Pociones y roba Pociones hasta que tengas exactamente 5.", "resB": "Está encantado de compartir una medicina en la que lleva meses trabajando.", "txtA": "", "txtB": "Roba Evento 56.", "A": [["pot5"]], "B": [["event", 56]], "y": [310, 355, 440, 582]}, "4": {"img": "037-327", "intro": "toas por los hermosos jardines de la sede de los magos mientras ellos están ocupados po-- niendo a prueba al muchacho. Finalmente, te llaman. “Es inútil. El chico no es una Fuente, aunque haya algo de poder en él, no es suficiente para formarle y que pueda convertirse en mago. Lo que ocurrió durante vuestro encuentro debe haber sido una casualidad.”", "optA": "Deja al chico en paz.", "optB": "Llévate al chico contigo.", "resA": "Antes de irte, decides pasar algún tiempo entrenando.", "resB": "Un brujo niñera. Una niñera mutante. ¡Eso eres tú ahora!", "txtA": "Aumenta el nivel de cualquier Atributo en 1.", "txtB": "Roba Evento 5.", "A": [["attr", "any", 1]], "B": [["event", 5]], "y": [310, 355, 440, 553]}, "5": {"img": "037-328", "ops": [["keep", "jardel"]]}, "6": {"img": "037-329", "intro": "EE familia cuyo blasón decora el sello del anillo es Terrat, una casa famosa por su influencia en muchas tierras del continente. Se dice que pueden permitirse contratar y entrenar a una cantidad suficiente de mercenarios como para declarar la guerra a todo un reino. El valedor de la familia reacciona nervioso al ver el anillo: \"¿De dónde lo has sacado?\"", "optA": "Háblale del gólem.", "optB": "Invéntate una historia sobre el hallazgo del anillo en una tienda de antigúedades.", "resA": "“En primer lugar, no deberías haber estado allí. Ahora toma tu pago y olvídate del gólem\".", "resB": "Dudas de que el valedor te haya creído, pero no insiste en el tema. \"Sí quieres puedes usar una de nuestras salas de entrenamiento. Creo que nuestras instalaciones son muy superiores a cualquier otra que puedas encontrar en una fortaleza de brujos”.", "txtA": "Tira un dado: 1-2: Obtén 2 de Oro. 3-4: Obtén 3 de Oro. 5-6: Obtén 4 de Oro.", "txtB": "Añade 1 de las Cartas de Acción reveladas de : Coste 0 a tu pila de descartes.", "A": [["dice", [[1, 2, [["gold", 2]]], [3, 4, [["gold", 3]]], [5, 6, [["gold", 4]]]]]], "B": [["gain", 0]], "y": [281, 326, 449, 647]}, "7": {"img": "037-330", "ops": [["mini", {"sh": "0", "draw": 3, "r": [[0, 2, [["pot", 2]]], [3, 4, [["pot", 3]]], [5, 99, [["shieldMax"], ["pot", 3]]]]}]]}, "8": {"img": "037-331", "intro": "OS ojos del señor de la región están llenos de dolor y duda. Parece contener las lágrimas mientras te habla de la maldición que afectó a su hija: de once años. \"Hace siete años que no veo la cara de mi niña. Todo lo que veo es esa monstruosidad escamosa”, te dice. Conoces dos formas de anular la maldición.", "optA": "Realiza un ritual cerca del refugio del monstruo.", "optB": "6 Trata de forzar a la bestia a salir a", "resA": "(6 todo sale como debería. La sangre del padre, las lágrimas de la madre, la luna llena y hasta el canto de un ruiseñor solitario. Cuando el pájaro enmudece, ves a una chica demacrada y aturdida tendida en el suelo de piedra del castillo.", "resB": "Logras enfrentarte a la bestia maldita, pero no consigues que abandone el castillo. Al ponerse el sol, sientes que tus fuerzas menguan y te das cuenta de que la bestia debe morir. Su padre se niega a pagar, pero te agradece que le hayas quitado esta carga de encima. Dejas que llore a su hija.", "txtA": "Obtén 2 de Oro.", "txtB": "Añade 1 de las Cartas de Acción reveladas de : coste 0 a tu pila de descartes.", "A": [["gold", 2]], "B": [["gain", 0]], "y": [256, 321, 412, 613]}, "9": {"img": "037-332", "intro": "El mago parece animado por tus preguntas sobre hechizos para invocar monstruos. \"¿Por qué? ¿Ha habido una catástrofe?\", pregunta esperanzado. “Cuando la magia está a tu disposición, el mundo parece un lugar sumamente aburrido. Puedes tener cualquier cosa, poder y fuerza, lo que quieras. Pero el mundo es aburrido, aquí nunca pasa nada. Yo quería ver el mundo arder, así que invoqué a los monstruos donde más daño podían hacer\".", "optA": "\"El Consejo se enterará de todo.”", "optB": "\"Más monstruos cerca de los asentamientos humanos significa más trabajo para mí.”", "resA": "El hechizo te golpea en el pecho. Es tan poderoso que te deja sin aliento. Tu espada no corta más que aire, y el siguiente hechizo golpea una pared. Entonces tu espada alcanza al mago en la mejilla. No hay vencedores en esta lucha, pero al menos conseguís no mataros el uno al otro.", "resB": "El mago agradece que te ocupes de tus propios asuntos. Ignora tu límite de Pociones y roba Pociones hasta que tengas exactamente 5.", "txtA": "Añade 1 de las Cartas de Acción reveladas de coste 2 a tu pila de descartes.", "txtB": "", "A": [["gain", 2]], "B": [["pot5"]], "y": [332, 375, 475, 759]}, "10": {"img": "039-342", "ops": [["school10"]]}, "11": {"img": "039-343", "ops": [["keep", "martyn"]]}, "12": {"img": "039-344", "ops": [["mini", {"sh": -2, "draw": 2, "r": [[0, 2, [["potUpTo", 4]]], [3, 4, [["keep", "freeBuy"]]], [5, 99, [["gain", 1]]]]}]]}, "13": {"img": "039-345", "ops": [["keep", "armadura"]]}, "14": {"img": "039-346", "ops": [["keep", "ballesta2"]]}, "15": {"img": "039-347", "ops": [["keep", "nudillos"]]}, "16": {"img": "039-348", "ops": [["keep", "caballo"]]}, "17": {"img": "039-349", "intro": "se nota a simple vista que todo el poblado lleva días preparándose para una celebración. Las! largas mesas del mercado crujen bajo el peso de. la comida y la bebida. Encuentras al celebrante a la cabeza de una mesa. Parece tener apenas cincuenta años y, al acercarte, le oyes contarle al regidor algo sobre mezclar hierbas para aumentar la longevidad. Tu medallón vibra violentamente cuando te das cuenta de que el hombre es un vampiro.", "optA": "Háblale de los deseos de sus amigos.", "optB": "Informa al regidor sobre el vampiro.", "resA": "Oe vampiro te lleva a aparte. \"Mi amigo iba a avisarme si notaba que llevaba demasiado tiempo en un mismo lugar. Encontró una forma inusual de transmitir el mensaje, eso es indudable. Pero aprovechemos la ocasión ¿Me permites estirar las piernas en tu compañía?\"", "resB": "El vampiro te ataca en el momento en el que empiezas a hablar, antes de que nadie pueda reaccionar.", "txtA": "Roba Evento 18.", "txtB": "El jugador de tu derecha te lee Evento 19.", "A": [["event", 18]], "B": [["event", 19]], "y": [336, 381, 482, 708]}, "18": {"img": "039-350", "ops": [["keep", "oscar"]]}, "19": {"img": "041-360", "ops": [["mini", {"sh": "0", "draw": 3, "r": [[0, 3, [["attr", "low", 1], ["gold", 1]]], [4, 5, [["attr", "low", 1], ["gold", 3]]], [6, 99, [["attr", "any", 1]]]]}]]}, "20": {"img": "041-361", "ops": [["keep", "adje"]]}, "21": {"img": "041-362", "ops": [["dice", [[1, 3, [["gold", 3]]], [4, 6, [["shieldTo", 0], ["attr", "low2", 1], ["noExplore"]]]]]]}, "22": {"img": "041-363", "intro": "me acercas a una pequeña choza en una colina. Al subir la cuesta, una adolescente sale corriendo a saludarte. Lleva en la mano una honda con la que ha estado jugando hasta hace un momento. Te conduce hasta la puerta, corriendo a tu alrededor en juguetones círculos. La madre de la niña te oye y se le llenan los ojos de lágrimas. Desaparece un momento en la cabaña y vuelve con una caja llena de recuerdos familiares. \"Llévate lo que quieras, pero deja a Kaya con nosotros”.", "optA": "Deja que la niña decida.", "optB": "Acepta la caja y deja a la niña.", "resA": "Kaya abraza a su madre y se pone a tu lado. Está ansiosa por comenzar sus aventuras.", "resB": "La mujer se despide con un alivio evidente. Algunos de los objetos de la caja podrían interesar a los mercaderes.", "txtA": "Roba Evento 23.", "txtB": "Deja esta carta delante de ti. En lugar de tu próxima Exploración, durante la Fase II, descarta esta carta y obtén 4 de Oro.", "A": [["event", 23]], "B": [["keep", "nextGold4"]], "y": [388, 430, 521, 634]}, "23": {"img": "041-364", "ops": [["keep", "kaya"]]}, "24": {"img": "041-365", "intro": "4C HA > TVE AAA. A TE Al ciudad te recibe con una lluvia torrencial. Un mendigo solitario se encuentra a las puertas. \"La van a colgar hoy en la plaza\", declara con regocijo. \"Sacarán a la hechicera de un momento a otro. De la cárcel a la horca, eso es todo 10 que les espera a los monstruos\".", "optA": "Ve a la plaza mayor.", "optB": "Ve a la cárcel.", "resA": "Los guardias de la ciudad debieron haber presentido problemas. Al llegar, observas a tres hombres desenvainando sus espadas, mientras otros se unen desde las calles laterales. La chica no se encuentra por ninguna parte. Esperas que el alboroto le brinde la oportunidad de escapar...", "resB": "Gliegas al edificio justo a tiempo para presenciar su derrumbe. Entre las nubes de polvo que se levantan, distingues siluetas tambaleándose. Sin embargo, cuando te acercas, ya todo ha terminado. Encuentras a la niña, polvorienta y aterrorizada, sentada entre los cuerpos de los soldados fallecidos... ¡Es momento de partir!.", "txtA": "Reduce tu nivel de Escudo a 0, aumenta en 1 el nivel de dos de tus Atributos más bajos, pasa inmediatamente a la Fase III y roba 1 carta menos.", "txtB": "Roba Evento 20 y durante la Fase III, roba 1 carta menos.", "A": [["shieldTo", 0], ["attr", "low2", 1], ["toP3"], ["p3", -1]], "B": [["event", 20], ["p3", -1]], "y": [218, 256, 309, 620]}, "25": {"img": "041-366", "intro": "\"¿Quieres escuchar la historia del profeta Lebioda?”, dice una voz familiar al otro lado de tu puerta.", "optA": "Abre la puerta y ataca a los impostores.", "optB": "Salta por la ventana y embosca a los impostores por la espalda.", "resA": "No les das tiempo a reaccionar mientras los empujas contra la pared con una Señal. Uno de los hombres cae inmediatamente inconsciente, mientras que el otro necesita un poco de ayuda... que rápidamente le proporcionas con tu puño.", "resB": "Sales de la posada rápida y silenciosamente por la ventana. Observas dos caballos atados a un poste que no estaban allí la noche anterior. En las alforjas encuentras una bolsa finamente decorada.", "txtA": "Aumenta tu nivel de Especialidad en 1.", "txtB": "Deja esta carta frente a ti. Tu límite de Pociones es 5.", "A": [["attr", "spe", 1]], "B": [["keep", "potion5"]], "y": [108, 149, 279, 506]}, "26": {"img": "041-367", "intro": "7 cuanto los lugareños se enteran de tu profesión, desconfían rápidamente. Todos se mar- . chan cuando se les pregunta por la Escuela de la Grulla. Te das cuenta de que el legendario brujo dejó una profunda herida en el corazón de la comunidad, una herida que no sanará durante muchas generaciones. Finalmente descubres que se puede encontrar más información en la cima de la montaña que se alza tras el pueblo.", "optA": "Busca contratos. Es hora de demostrar a la gente que los brujos pueden ser útiles.", "optB": "Prepárate para un viaje a las montañas.", "resA": "Vuelves al poblado con la cabeza de una arpía y sientes que por fin los lugareños empiezan a tratarte con un poco menos de antipatía.", "resB": "La montaña está cubierta de nieve. Temblando de frío y agotado, pones pie en la cima para comprobar que tus esfuerzos han sido recompensados: una espada de la Escuela de la Grulla se encuentra entre un montón de nieve. La empuñadura se adapta perfectamente a tu mano.", "txtA": "Reduce tu nivel de Escudo en 1 y aumenta tu nivel de Atributo más bajo en 1.", "txtB": "Deja esta carta delante de ti. Cada Carta de Ataque Rápido (azul) que uses en un Combo inflige 1 de Daño adicional.", "A": [["shield", -1], ["attr", "low", 1]], "B": [["keep", "crane"]], "y": [303, 371, 439, 610]}, "27": {"img": "041-368", "ops": [["mini", {"sh": -2, "draw": 2, "r": [[0, 2, [["gold", 3]]], [3, 4, [["attr", "low", 1]]], [5, 99, [["p3", 1]]]]}]]}, "28": {"img": "043-378", "ops": [["keep", "brazales"]]}, "29": {"img": "043-379", "intro": "ds carretera que lleva al poblado discurre entre campos llenos de cultivos dorados. Pasas junto a casas aisladas para luego acabar en una zona densamente poblada a ambos lados de la carretera. Observas que los lugareños permanecen en el centro, caminan evitando acercarse demasiado a ambos lados de la carretera.", "optA": "Encuentra la mantícora para deshacerte de la procedencia del veneno.", "optB": "Haz entrar en razón a los bandidos.", "resA": "Un monstruo de esta edad tan avanzada es algo raro de ver. La mantícora ni siquiera intenta levantarse y ruge lastimeramente cuando desenvainas tu espada.", "resB": "Cuando te acercas al tejado, uno de los jóvenes cae por el borde. Los dos bandidos restantes intentan atacarte, pero pierden rápidamente el equilibrio en el inclinado tejado. Ni siquiera tienes que desenvainar la espada. Los aldeanos te lo agradecen.", "txtA": "Añade 1 de las Cartas de Acción reveladas de coste 2 a tu pila de descartes.", "txtB": "Obtén 4 de Oro, añade 1 de las Cartas de Acción reveladas de coste 0 a tu pila de descartes. Durante tu siguiente Exploración (en lugar del proceso normal), el jugador a tu de1 recha te lee Evento 30.", "A": [["gain", 2]], "B": [["gold", 4], ["gain", 0], ["keep", "next30"]], "y": [244, 312, 371, 568]}, "30": {"img": "043-380", "intro": "di arrogancia juvenil no permitió que los jóvenes se olvidaran de todo el asunto. Los cuatro te siguieron y te rodearon. No parecen espadachines experimentados, pero tal vez su número les proporcione una ventaja en el combate.", "optA": "Diles que no quieres derramamiento de sangre.", "optB": "Desenvaina tu espada.", "resA": "Casi puedes oírles pensar, pero finalmente la razón triunfa sobre su deseo de venganza. “Tienes suerte de que estemos de buen humor\", dicen y hacen girar a sus caballos. Mientras los ves alejarse, te das cuenta de que tu medallón está vibrando.", "resB": "La ventaja numérica está del lado de tus oponentes, y sus músculos palpitan con la necesidad de venganza. Consigues ganar el combate, pero no es fácil, Tira un dado: 1-2: Reduce tu nivel de Escudo en 2. 3-4: Reduce tu nivel de Escudo en 1. 5-6: No reduzcas tu nivel de Escudo.", "txtA": "Obtén 1 Rastro cualquiera.", "txtB": "", "A": [["trail"]], "B": [["dice", [[1, 2, [["shield", -2]]], [3, 4, [["shield", -1]]], [5, 6, []]]]], "y": [227, 295, 383, 609]}, "31": {"img": "043-381", "ops": [["keep", "botas"]]}, "32": {"img": "043-382", "intro": "el tontrato con el gremio de mercaderes es muy sencillo y lo cumples sin problemas. Cobrar el pago al representante del gremio local, que nunca ha oído hablar del contrato, resulta mucho más complicado.", "optA": "Regatear. \"No iré a ninguna parte sin mi dinero\".", "optB": "Mentir. \"Mi recompensa estaba pactada de antemano y nunca fue monetaria\".", "resA": "El representante es reacio a echar mano de las arcas del gremio.", "resB": "El representante es reacio a aceptar el acuerdo, pero finalmente cede.", "txtA": "Tira un dado: 1-2: Obtén 2 de Oro. 3-4: Obtén 3 de Oro. 5-6: Obtén 4 de Oro.", "txtB": "Deja esta carta delante de ti. Una vez por Turno: puedes moverte a cualquier Lugar de Agua conectado jugando cualquier tipo de terreno.", "A": [["dice", [[1, 2, [["gold", 2]]], [3, 4, [["gold", 3]]], [5, 6, [["gold", 4]]]]]], "B": [["keep", "water"]], "y": [227, 295, 420, 619]}, "33": {"img": "043-383", "intro": "as una breve investigación, llegas a un barco custodiado únicamente por tres marineros armados con estoques. Al verte, el que está más cerca de ti se lleva la mano a la cadera, justo al lado de la empuñadura de su arma. “¿Eres cargamento... o proveedor?, donde vamos, la gente paga bien por todo tipo de bichos raros que conseguimos encerrar en la bodega”.", "optA": "“Podría ayudaros a capturar... monstruos.”", "optB": "Intenta averiguar qué hay en la bodega de carga.", "resA": "Alcanzas fácilmente a un grupo de hombres que intentan capturar a un vampiro y consigues completar el trabajo sin incidentes.", "resB": "Por la noche consigues colarte a bordo. En la bodega, encuentras varias criaturas sintientes que decides liberar. Conocen un escondite en la ciudad. Si tu nivel de Escudo es 0: roba 4 cartas de tu mazo. De lo contrario, roba 3 cartas.", "txtA": "Añade la primera Carta de Acción revelada de coste 2 a tu pila de descartes.", "txtB": "", "A": [["gain", "first2"]], "B": [["if", "shield0", [["draw", 4]], [["draw", 3]]]], "y": [277, 324, 438, 609]}, "34": {"img": "043-384", "intro": "iblezas a preguntarte si todas las ciudades del continente tienen posadas similares con clientes parecidos. Sigues el rastro del hombre hasta otra posada envuelta en una palpable aura de misterio e inseguridad. Te fijas en el rostro familiar de la esquina, el rostro de un embustero... y de un ladrón.", "optA": "Exige al hombre que pague por lo que ha robado.", "optB": "Toma lo que es tuyo por la fuerza.", "resA": "No esperaba que le encontraras. Sus manos tiemblan al abrir su bolsa.", "resB": "El hombre está paralizado por el miedo y no intenta oponer resistencia, pero tus provisiones hace tiempo que están vendidas. Registras las bolsas del ladrón y encuentras interesantes fórmulas y estimulantes.", "txtA": "Obtén 3 de Oro.", "txtB": "Si tienes 0 o 1 Poción: aumenta en 1 tu nivel de Alquimia. De lo contrario, roba 3 cartas de tu mazo.", "A": [["gold", 3]], "B": [["if", "pot<=1", [["attr", "alc", 1]], [["draw", 3]]]], "y": [253, 318, 422, 536]}, "35": {"img": "043-385", "intro": "e CIUTAT IA TIT, + TOS TAPA Micuentras a Gustav en una choza pequeña y destartalada al borde de una arboleda. Sus ojos brillan alegremente cuando te mira entre nubes de incienso y humo de pipa. Detrás de él hay una chimenea con un caldero burbujeante. “Rara vez recibo visitas. ¿Te envía Malvia? Siéntate\".", "optA": "Pregúntale por sus fórmulas.", "optB": "Pregúntale por la poción que hierve a fuego lento en el caldero.", "resA": "Gustav se niega a revelar sus secretos, pero está encantado de compartir sus pociones.", "resB": "“La llamo yagé. Toma, pruébala”. Aunque estás seguro de que tu cuerpo nunca abandonó la casa de Gustav, cuando los efectos de la poción desaparecen te sientes como si hubieras regresado de un largo viaje.", "txtA": "Roba (hasta) 4 Pociones.", "txtB": "Roba 2 cartas de tu mazo.", "A": [["potUpTo", 4]], "B": [["draw", 2]], "y": [253, 298, 428, 543]}, "36": {"img": "043-386", "ops": [["test", "atk", [[3, 7, [["attr", "def", -1], ["gain", 1]]], [8, 10, [["shield", -2], ["gain", 1]]], [11, 13, [["shield", -1], ["burn", 1], ["gain", 1]]], [14, 99, [["gain", 1]]]]]]}, "37": {"img": "045-396", "intro": "4 ETT VATTILATES PO TI TACA Wifmascarado y encapuchado, te preparas para tender una emboscada a la dama que pretendía el petimetre. Cuando la alcanzas en un callejón, oyes una voz familiar detrás de ti. \"¡Deja en paz a la dama, bribón, o enfréntate al Vengador Carmesí!”", "optA": "Más bien el Idiota Carmesí...”", "optB": "\"¡Oh, no, el Vengador Carmesí no!”", "resA": "Ya es suficiente. Te arrancas la máscara y te diriges al patán por su nombre, ordenándole que se largue sin demora. La dama se indigna ante su engaño y te ofrece alojamiento para esta noche... como pago por tu honradez.", "resB": "El patán te ataca según lo planeado, y vuestras espadas chocan un par de veces. Entonces escapas, dejándole con la dama rescatada. El hombre te encuentra por la mañana y te paga por la ayuda.", "txtA": "Durante la Fase III, roba 1 carta adicional.", "txtB": "Obtén 4 de Oro. No puedes realizar una Acción de Exploración este turno, y durante la Fase III, roba 1 carta menos.", "A": [["p3", 1]], "B": [["gold", 4], ["noExplore"], ["p3", -1]], "y": [226, 271, 381, 579]}, "38": {"img": "045-397", "ops": [["byattr", "alc", [[1, 2, [["shield", -2], ["attr", "any", 1]]], [3, 3, [["shield", -1], ["attr", "low", 1]]], [4, 5, [["potUpTo", 4]]]]]]}, "39": {"img": "045-398", "ops": [["dice", [[1, 2, [["shield", -1], ["attr", "low", 1]]], [3, 4, [["attr", "any", 1]]], [5, 6, [["burn", 1], ["gain", 2]]]]]]}, "40": {"img": "045-399", "intro": "dir TETAS AAA A di palabra es tu garantía. Esta vez, te lleva a una pista de circo. Ni siquiera tienes que esforzarte mucho, ya que tu sola presencia hace que el público grite de emoción. Para tu sorpresa, el director suelta tres barghests en la pista. Esto no estaba en tu contrato...", "optA": "Trágate tu orgullo y lucha contra los barghests.", "optB": "Lucha utilizando Señales para dañar la carpa del circo tanto como sea posible.", "resA": "El espectáculo supera las expectativas del público y del director. Te pagan una fortuna.", "resB": "Cuando muere la última bestia, la carpa parece haber sido arrasada por un huracán. “Tus ganancias se destinarán a reparar la carpa... Ahora vete”, dice el director.", "txtA": "Obtén 3 de Oro.", "txtB": "Aumenta tu nivel de Especialidad en 1.", "A": [["gold", 3]], "B": [["attr", "spe", 1]], "y": [226, 290, 410, 526]}, "41": {"img": "045-400", "ops": [["dice", [[1, 2, [["gold", 2], ["shield", -2]]], [3, 4, [["gold", 3]]], [5, 6, [["gold", 3], ["pot", 2]]]]]]}, "42": {"img": "045-401", "ops": [["bylevel", [[1, 2, [["attr", "any", 1]]], [3, 3, [["attr", "low", 1]]], [4, 5, [["gain", 1]]]]]]}, "43": {"img": "045-402", "ops": [["dice", [[1, 1, [["attr", "low", 1]]], [2, 2, [["attr", "spe", 1]]], [3, 3, [["attr", "atk", 1]]], [4, 4, [["attr", "def", 1]]], [5, 5, [["attr", "alc", 1]]], [6, 6, [["attr", "any", 1]]]]]]}, "44": {"img": "045-403", "ops": [["dice", [[1, 2, [["gold", 3]]], [3, 4, [["gold", 3], ["trail"]]], [5, 6, [["gold", 4]]]]]]}, "45": {"img": "045-404", "intro": "e lleva algún tiempo encontrar al chico, pero logras localizarlo en una lúgubre taberna. Te sientas a su mesa y te recibe con una jarra de grog. Tendrás que intentar convencerle.", "optA": "Intenta disuadirle para que no se marche.", "optB": "Pregúntale de qué huye.", "resA": "Tira 1 dado: 1-3: “La abuela siempre parlotea, y yo sólo quiero... ¡hic!... ¡Quiero aventuras! ¡En alta mar! Aquí tienes algo de oro por las molestias, ¡ahora vete!”", "resB": "“De mí mismo. Al final todos huimos de nosotros mismos”, dice. Sientes que no tienes suficiente grog en la sangre para intentar rebatir su afirmación. La noche transcurre tranquilamente.", "txtA": "Obtén 3 de Oro, descarta 1 carta de tu mano. 4-6: \"Puede que la abuela tenga razón. No sería útil en un barco... Y odio el grog. Ya he pagado para pasar la noche, pero no dormiré aquí. Si necesitas un lugar para pasar la noche, usa el mío.” Pasa directamente a la Fase III y roba 1 carta adicional.", "txtB": "Durante la Fase III, roba 1 carta adicional.", "A": [["dice", [[1, 3, [["gold", 3], ["dhand", 1]]], [4, 6, [["toP3"], ["p3", 1]]]]]], "B": [["p3", 1]], "y": [167, 211, 277, 727] function slotCost(i) { const c = G.market[i]; if (!c) return 99; if (CARDS[c].trash) return 1; return Math.max(0, CARDS[c].cost + (i <= 1 ? 1 : 0) - (i === 5 ? 1 : 0)); }

// ---------- Bucle de juego ----------
let RUNNING = false;

// Opciones de movimiento desde la localización actual
function moveOptions(p) {

    const match = p.hand.filter(c => handT(c) === t || handT(c) === '*');
    if (match.length) pays.push({ type: 'card', label: 'Descartar 1 carta de ' + TERR[t] + ' o comodín', cards: match });

    if (t === 'W' && p.equip.includes('water') && !p.flags.water && p.hand.length) pays.push({ type: 'water', label: 'Pacto del gremio: cualquier carta' });

}
async function payMove(p, pay) {
  let cards = [];

// ---------- Póquer de dados ----------
function pokerEval(d) {
  const cnt = {}; for (const x of d) cnt[x] = (cnt[x] || 0) + 1;
  const groups = Object.entries(cnt).map(([v, c]) => [c, +v]).sort((a, b) => b[0] - a[0] || b[1] - a[1]);
  const s = d.slice().sort().join('');
  let rank = 0, key = [];
  if (groups[0][0] === 5) rank = 8;
  else if (groups[0][0] === 4) rank = 7;
  else if (groups[0][0] === 3 && groups[1][0] === 2) rank = 6;
  else if (s === '23456') rank = 5;
  else if (s === '12345') rank = 4;
  else if (groups[0][0] === 3) rank = 3;
  else if (groups[0][0] === 2 && groups[1][0] === 2) rank = 2;
  else if (groups[0][0] === 2) rank = 1;
  key = groups.map(g => g[1]);
  return { rank, key };
}
const POKER_NAMES = ['Nada', 'Pareja', 'Dobles parejas', 'Trío', 'Escalera de cinco', 'Escalera de seis', 'Full', 'Póquer', 'Repóquer'];
function pokerCmp(a, b) { const A = pokerEval(a), B = pokerEval(b); if (A.rank !== B.rank) return A.rank - B.rank; for (let i = 0; i < Math.max(A.key.length, B.key.length); i++) { const x = A.key[i] || 0, y = B.key[i] || 0; if (x !== y) return x - y; } return 0; }
const roll5 = () => [1, 2, 3, 4, 5].map(() => 1 + rnd(6));
function aiReroll(d) {
  const e = pokerEval(d); if (e.rank >= 4) return [];
  const cnt = {}; for (const x of d) cnt[x] = (cnt[x] || 0) + 1;
  const keepVals = Object.keys(cnt).filter(v => cnt[v] >= 2).map(Number);
  return d.map((x, i) => keepVals.includes(x) ? -1 : i).filter(i => i >= 0);
}
async function pokerDuel(p, oppName, nonActiveFirst = true) {
  let mine = roll5(), theirs = roll5();
  await IO.dice(`Póquer contra ${oppName}`, mine, theirs, 'Tirada inicial');
  if (nonActiveFirst) { const rr = aiReroll(theirs); for (const i of rr) theirs[i] = 1 + rnd(6); if (rr.length) await IO.dice(`${oppName} repite ${rr.length} dado${rr.length > 1 ? 's' : ''}`, mine, theirs, ''); }
  const sel = await IO.pickDice('Elige qué dados repetir (o ninguno)', mine);
  for (const i of sel) mine[i] = 1 + rnd(6);
  const c = pokerCmp(mine, theirs);
  const win = c >= 0; // empate: gana el jugador activo
  await IO.dice(win ? '¡Ganas el póquer!' : 'Pierdes el póquer', mine, theirs, `${POKER_NAMES[pokerEval(mine).rank]} contra ${POKER_NAMES[pokerEval(theirs).rank]}`);
  return win;
}
async function pokerWitcher(p, o) {
  p.gold -= 1;
  log(`${pname(p)} juega al póquer con ${pname(o)}.`);
  const win = await pokerDuel(p, o.name);
  if (win) { gainGold(p, 3); log('Ganas el bote de 3 Oros.', 'good'); } else log(`${o.name} gana el póquer.`, 'bad');
}
async function pokerLocals(p) {
  p.gold -= 1;
  if (G.solo) {
    let d = roll5(); await IO.dice('Póquer en solitario', d, null, 'Tirada inicial');
    const sel = await IO.pickDice('Elige qué dados repetir', d); for (const i of sel) d[i] = 1 + rnd(6);
    const r = pokerEval(d).rank; const rew = [0, 0, 1, 2, 3, 3, 4, 5, 6][r];
    await IO.dice(`${POKER_NAMES[r]}: +${rew} Oro`, d, null, ''); gainGold(p, rew); return;
  }

// ---------- Fase II ----------

// ---------- Fase III ----------
async function phase3(p) {
  G.phase = 3; upd();

  if (p.hand.length) {
    const sel = await IO.pickCards(minDisc ? `Fase III: descarta al menos ${minDisc} carta(s) (máximo 3 en mano)` : 'Fase III: descarta las cartas que quieras', p.hand, minDisc, p.hand.length, { kind: 'p3disc' });

  }
  // 2. robar
  let target = p.p3base + p.p3mod + (G.exp.skellige && p.equip.includes('skBearFur') && isIsland(p.loc) ? 1 : 0);
  if (hasTrophy(p, 'hlobo') && LOC(p.loc).terr === 'M') target++;
  if (hasTrophy(p, 'penitente') && LOC(p.loc).terr === 'W') target++;
  if (p.p3exact != null) { drawCards(p, p.p3exact); log(`Robas ${p.p3exact} carta(s).`); }
  else { const n = Math.max(0, target - p.hand.length); const got = drawCards(p, n); log(`Robas ${got} carta(s) (hasta ${target}).`); }
  upd();
  // 3. obtener carta nueva (obligatorio si puedes pagarla)
  const free = p.equip.includes('freeBuy');
  const afford = G.market.map((c, i) => ({ c, i, cost: free ? 0 : slotCost(i) })).filter(x => x.c && x.cost <= p.hand.length);
  let took = null;
  if (afford.length) {
    const i = await IO.market(p, afford);
    const o = afford.find(x => x.i === i) || afford[0];
    if (o.cost > 0 && CARDS[o.c].trash) { const [c] = await IO.pickCards(`Coste: destruye 1 carta de tu mano`, p.hand, 1, 1, { kind: 'pay' }); p.hand.splice(p.hand.indexOf(c), 1); p.destroyed.push(c); log(`Destruyes ${CARDS[c].name}.`); }
    else if (o.cost > 0) { const pay = await IO.pickCards(`Paga ${o.cost}: descarta ${o.cost} carta(s) de tu mano`, p.hand, o.cost, o.cost, { kind: 'pay' }); for (const c of pay) { p.hand.splice(p.hand.indexOf(c), 1); p.discard.push(c); } }
    if (free && o.cost === 0 && slotCost(o.i) > 0) p.equip.splice(p.equip.indexOf('freeBuy'), 1);
    p.hand.push(o.c); took = o.i; G.market[o.i] = null; log(`Obtienes ${CARDS[o.c].name}.`);
    if (G.solo && took !== 5 && G.market[5]) { G.adisc.push(G.market[5]); G.market[5] = null; }
    refillMarket();
  } else log('No puedes pagar ninguna carta del mercado.');
  upd();
}

// Combate corto de evento
async function miniCombat(p, a) {

  const got = drawCards(p, a.draw);

<script>
// ===== Combate =====
// Luchadores: {type:'h', p} humano · {type:'b', p} automa · {type:'m', t, m, pool, disc, lvl} monstruo
function fname(f) { return f.type === 'm' ? f.m.name : pname(f.p); }
function isKO(f) {
  if (f.type === 'm') return f.pool.length === 0;
  if (f.type === 'b') return f.p.cdeck.length === 0;
  return f.p.deck.length === 0 && f.p.hand.length === 0;
}
function once(f, key) { if (f.once.has(key)) return false; f.once.add(key); return true; }
function clog(C, msg, cls) { log(msg, cls); C.lines.push({ m: msg, c: cls || '' }); if (C.lines.length > 60) C.lines.shift(); IO.combatUpdate && IO.combatUpdate(C); }
const monAbil = (C, k) => C.mon && C.mon.m.abil === k && !C.mon.ignoreAbil;

// Aplica Daño de src a tgt. Devuelve cartas descartadas.
async function damage(C, src, tgt, n, opts = {}) {
  if (n <= 0) return 0;
  if (G.exp.skellige && tgt.type === 'h' && src && src !== tgt && C.db1 && hasDB(tgt.p, 1)) { C.db1 = 0; n -= 1; clog(C, 'Bonificación de Dagón: el ataque inflige 1 de Daño menos.', 'good'); if (n <= 0) return 0; }

    if (G.exp.mtLarge) return damageLarge(C, src, tgt, n);
    const k = Math.min(n, tgt.pool.length); tgt.disc.push(...tgt.pool.splice(0, k));
    clog(C, `${fname(src)} inflige ${n} de Daño a ${tgt.m.name} (le quedan ${tgt.pool.length}).`, src.type === 'h' ? 'good' : '');
    return k;
  }
  if (tgt.type === 'b') {
    const b = tgt.p;
    if (tgt.immune) { clog(C, `${b.name} ignora el Daño este turno.`); return 0; }
    let rem = n; const s = Math.min(b.shield, rem); b.shield -= s; rem -= s;
    let k = 0;
    while (rem > 0 && b.cdeck.length) {
      const card = b.cdeck.shift(); b.cdisc.push(card); rem--; k++;
      const ac = ACARD(card);
      if (ac.bot === 'trigDmg2') { clog(C, `¡${b.name} activa una carta al descartarla: ${src.type === 'h' ? 'recibes' : fname(src) + ' recibe'} 2 de Daño!`, src.type === 'h' ? 'bad' : ''); await damage(C, tgt, src, 2); }
      if (ac.bot === 'trigShieldMax') { b.shield = shieldMax(b); clog(C, `${b.name} sube su Escudo al máximo al descartar una carta.`); }
    }
    clog(C, `${fname(src)} inflige ${n} de Daño a ${b.name} (Escudo −${s}, descarta ${k}; le quedan ${b.cdeck.length}).`, src.type === 'h' ? 'good' : '');
    return k;
  }
  // humano
  const p = tgt.p; let rem = n; let fromDeck = 0, fromHand = 0; const dCs = [], hCs = [];
  if (opts.handFirst && p.hand.length) {
    const k = Math.min(rem, p.hand.length);
    const sel = await IO.pickCards(`Bruja sepulcral: descarta ${k} carta(s) de tu mano`, p.hand, k, k, { kind: 'combat' });
    for (const c of sel) { p.hand.splice(p.hand.indexOf(c), 1); p.discard.push(c); hCs.push(c); }
    rem -= k; fromHand += k;
  }
  const s = Math.min(p.shield, rem); p.shield -= s; rem -= s;
  while (rem > 0 && p.deck.length) { const c = p.deck.shift(); p.discard.push(c); dCs.push(c); rem--; fromDeck++; }
  if (rem > 0 && p.hand.length) {
    const k = Math.min(rem, p.hand.length);
    const sel = k === p.hand.length ? p.hand.slice() : await IO.pickCards(`Recibes Daño: descarta ${k} carta(s) de tu mano`, p.hand, k, k, { kind: 'combat' });
    for (const c of sel) { p.hand.splice(p.hand.indexOf(c), 1); p.discard.push(c); hCs.push(c); }
    rem -= k; fromHand += k;
  }
  clog(C, `Recibes ${n} de Daño (Escudo −${s}${fromDeck ? `, mazo −${fromDeck}` : ''}${fromHand ? `, mano −${fromHand}` : ''}).`, 'bad');
  const lost = fromDeck + fromHand;

  if (fromDeck && hasTrophy(p, 'boira') && !C.boiraFlag) C.boiraFlag = true;
  await cardPassives(C, tgt, src, dCs, hCs);

}
// Pasivas de cartas de acción avanzadas/únicas al descartarse por un ataque del oponente
async function cardPassives(C, f, src, dCs, hCs) {
  const p = f.p;
  for (const c of [...dCs, ...hCs]) {
    const d = CARDS[c];
    if (d.passive === 'evasion') { p.shield = Math.min(shieldMax(p), p.shield + 2); clog(C, 'Evasión: Escudo +2.', 'good'); }
    if (d.passive === 'retal' && src && src !== f && !isKO(src)) { clog(C, `Represalia: ${fname(src)} recibe 2 de Daño.`, 'good'); await damage(C, f, src, 2); }

}
async function discardRandomHand(C, f, n, deckFallback = false, src = null) {

}
async function botDiscard(C, f, src, n) { // descarta n cartas del mazo de combate del automa (por ataque)

const ACARD = id => AUTOMA_CARDS.find(c => c.id === id);

function comboEval(p, combo, extra, ctx = {}, wilds = {}) {

}
function estimateMon(e, lvl, foe) {
  const at = a => foe.p.attrs[a];
  switch (e.t) { case 'dmg': return e.v; case 'dmgL': return e.v[lvl - 1]; case 'rand': return lvl + 1; case 'burn': return 2; case 'low': return [0, 1, 2][lvl - 1] + 1; case 'dmgAttr': return at(e.a); }

}
async function applyMonEffect(C, me, foe, e, first) {
  let dmg = 0;
  if (me.tm && me.tm.dmgOnly && (e.t === 'rand' || e.t === 'burn')) { clog(C, 'Debilidad: se ignora el efecto que no es Daño.', 'good'); return; }

  switch (e.t) {
    case 'dmg': dmg = e.v; break;
    case 'dmgL': dmg = e.v[me.lvl - 1]; break;
    case 'dmgAttr': dmg = foe.p.attrs[e.a]; break;
    case 'low': lowerAttr(foe.p, e.a); dmg = [0, 1, 2][me.lvl - 1]; break;
    case 'rand': if (foe.type === 'h') await discardRandomHand(C, foe, me.lvl, true, me); else await botDiscard(C, foe, me, me.lvl); return;
    case 'burn':
      if (foe.type === 'h') { const p = foe.p; if (p.hand.length) { const [c] = await IO.pickCards('Destruye 1 carta de tu mano', p.hand, 1, 1, { kind: 'combat' }); p.hand.splice(p.hand.indexOf(c), 1); p.destroyed.push(c); clog(C, `Destruyes ${CARDS[c].name}.`, 'bad'); } else if (p.deck.length) { const c = p.deck.shift(); p.destroyed.push(c); clog(C, `Se destruye ${CARDS[c].name} de tu mazo.`, 'bad'); } }

  if (foe.type === 'h' && first && foe.p.equip.includes('jardel') && once(foe, 'jardel')) { dmg = Math.max(0, dmg - 2); clog(C, 'Jardel: el Daño se reduce en 2.'); }
  if (monAbil(C, 'lamia') && (me.lamiaN === 1 || me.lamiaN === 2)) { dmg += 2; clog(C, 'Lamia: con 1-2 cartas en su mazo, su ataque inflige 2 de Daño adicional.'); }
  let manti = false;
  if (monAbil(C, 'manticora') && dmg > 0) { dmg -= 1; manti = true; }
  await damage(C, me, foe, dmg, { handFirst: first && monAbil(C, 'bsepulcral') && foe.type === 'h' });
  if (manti) { if (foe.type === 'h') await discardRandomHand(C, foe, 1, false, me); else await botDiscard(C, foe, me, 1); }
}

// ---------- Turno de combate del automa ----------
async function botCombatTurn(C, me, foe) {

}
async function playBotCard(C, me, foe, first, depth) {
  const b = me.p; if (!b.cdeck.length) return;
  const id = b.cdeck.shift(); const ac = ACARD(id); b.cdisc.push(id); C.botColor = ac.color;
  let d = ac.dmg, s = ac.sh, heal = 0, combo = false, x = null;
  if (me.next2) { d += 2; me.next2 = false; }
  const bot = ac.bot;
  if (bot && bot.startsWith('esp')) { const sp = AUTOMA_SPECIAL[b.school][+bot[3]]; d += sp.d || 0; s += sp.s || 0; heal += sp.heal || 0; combo = !!sp.combo; x = sp.x || null; }
  else if (bot && bot.startsWith('pot') && b.potions.length) {
    G.potDisc.push(b.potions.shift());

    if (monAbil(C, 'yghern') && ac.color === 'B') d -= 1;

  if (monAbil(C, 'susurradora') && ac.color === 'Y') b.shield = Math.max(0, b.shield - 2);
  if (heal) { const pool = b.cdisc.slice(0, -1); const take = pool.splice(-heal); b.cdisc = [...pool, id]; b.cdeck.push(...take); shuffle(b.cdeck); if (take.length) clog(C, `${b.name} recupera ${take.length} carta(s).`); }
  if (x === 'shieldMax') b.shield = shieldMax(b);
  if (x === 'immune') { me.immune = true; clog(C, `${b.name} ignorará el Daño en el siguiente turno.`); }
  if (x === 'next2') me.next2 = true;
  if (combo && depth < 3 && b.cdeck.length) await playBotCard(C, me, foe, first, depth + 1);
}

// ---------- Combates completos ----------

  if (ab === 'sumergidos' && p.deck.length) { const [c] = await IO.pickCards('Nido de sumergidos: descarta 1 carta de tu mazo', p.deck, 1, 1, { kind: 'combat' }); p.deck.splice(p.deck.indexOf(c), 1); p.discard.push(c); shuffle(p.deck); }

async function prepBotVsMonster(C, bf, mf) {

function spawnAfter(t, lvl, defeated) {
  const old = G.mon[t]; if (old) returnLocToken(old.loc);
  if (G.exp.mtLarge) resetWeak(t);
  for (const p of G.players) {
    if (p.trails[t] != null) { returnLocToken(p.trails[t]); p.trails[t] = null; }
    for (const q of p.tracking.slice()) if (q.terr === t) { returnLocToken(q.loc); p.tracking.splice(p.tracking.indexOf(q), 1); }

    const L = defeated ? Math.min(3, lvl + 1) : lvl;
    for (const l of [L, L + 1, L - 1, 3, 2, 1]) { if (l < 1 || l > 3) continue; if (G.monPile[l].length) { n = G.monPile[l].shift(); break; } if (G.fled[l].length) { shuffle(G.fled[l]); n = G.fled[l].shift(); break; } }

async function fightMonster(p, t) {

  const winner = isKO(mf) ? me : await runCombat(C, first);
  const lvl = mf.m.lvl;

  if (winner === me) result = 'win';
  else result = mf.pool.length <= 1 ? 'repel' : 'defeat';
  if (LG()) result = await largeFightEnd(p, mf, result);

    await gainZeroCard(p);
  } else {
    log(`${mf.m.name} te derrota.`, 'bad');
    if (!hasTrail(p, t) && G.locPile[t].length) p.trails[t] = drawLocToken(t);
    await gainZeroCard(p); p.p3base = 2;

}
async function botFightMonster(b, t) {
  const mf = makeMonFighter(t); const me = { type: 'b', p: b };
  const C = newC('mon', me, mf);
  log(`${pname(b)} combate contra ${mf.m.name}.`, 'sys');
  await IO.combatOpen(C);

  const winner = await runCombat(C, first);

  await IO.combatEnd(C, result);
  if (result === 'win') { log(`${b.name} derrota a ${mf.m.name}.`, 'bad'); spawnAfter(t, lvl, true); await gainTrophy(b, { t: 'mon', n: mf.m.n }); }

  else { log(`${mf.m.name} derrota a ${b.name}.`, 'good'); if (!hasTrail(b, t) && G.locPile[t].length) b.trails[t] = drawLocToken(t); }

// Combate entre brujos: att = atacante
async function fightWitcher(att, def) {
  const A = { type: att.bot ? 'b' : 'h', p: att }, D = { type: def.bot ? 'b' : 'h', p: def };
  const C = newC('wit', A, D);
  log(`${pname(att)} desafía a ${pname(def)} a un combate.`, 'sys');
  G.tavern = att.loc;
  // apuestas del humano espectador
  let bet = null; const h = human();
  if (att.bot && def.bot && G.nP >= 3 && h.gold >= 1) {
    const v = await IO.choose(`Apuesta (1 Oro) en el combate ${att.name} contra ${def.name}`, [{ label: 'Apostar por ' + att.name, value: 'A' }, { label: 'Apostar por ' + def.name, value: 'D' }, { label: 'No apostar', value: null }], {});
    if (v) { bet = v; h.gold -= 1; }
  }
  await IO.combatOpen(C);
  for (const f of [A, D]) { if (f.type === 'b') prepBot(f.p); else makeLife(f.p); }
  const winner = await runCombat(C, A);
  const W = winner.p, L = (winner === A ? D : A).p;
  const gold = REP_GOLD[Math.min(3, L.troph)];
  for (const f of [A, D]) { if (f.type === 'b') endBot(f.p); else endHuman(f.p); }
  await IO.combatEnd(C, winner === A ? 'attWin' : 'defWin', { W, L });
  log(`${pname(W)} gana el combate.`, W.bot ? 'bad' : 'good');
  if (bet) { const won = (bet === 'A') === (winner === A); if (won) { h.gold += 1 + gold; log(`Ganas la apuesta: +${1 + gold} Oro.`, 'good'); } else log('Pierdes la apuesta.', 'bad'); }
  if (winner === A) {
    if (!W.bot) gainGold(W, gold);
    if (!hasW(W, L.school)) await gainTrophy(W, { t: 'wit', s: L.school }); else log(`${pname(W)} ya tenía un Trofeo de ${SCHOOLS[L.school].name}.`);
    if (!L.bot) { await gainZeroCard(L); reshuffleAll(L); drawCards(L, 3); }
  } else {
    if (!W.bot) { gainGold(W, gold); reshuffleAll(W); drawCards(W, 4); }
    if (!L.bot) { await gainZeroCard(L); L.p3mod -= 1; }
  }
  if (G.exp.skellige) for (const f of [att, def]) if (!f.bot) afterFightDagonBonus(f);
  upd();
  return W;
}

<script>

function mcLabel(c, lvl, abil) { return isSpecial(c) ? `Ataque especial ${c - 19}${abil && LARGE[abil] ? ': ' + LARGE[abil].atk[c - 20][0] : ''}` : `carga ${mcTxt(MCOMBAT[c].C, lvl)} / mordisco ${mcTxt(MCOMBAT[c].M, lvl)}`; }

// ---------- Preparación y fichas de Debilidad ----------
function setupLarge() {
  const regs = shuffle([...Array(20).keys()]);
  G.mcBox = regs.splice(0, 4); G.mcAside = regs.splice(0, 4);
  G.mcBase = [...regs, 20, 21, 22, 23]; G.mcL3 = false;

}

}

    const n = G.weak[t].shift(); G.weakOn[t] = null; p.weak = p.weak || []; p.weak.push({ t, n });
    const m = MON(G.mon[t].n); const L = LARGE[m.abil];
    log(`Encuentras una ficha de Debilidad (${TERR[t]}, ${['I', 'II', 'III', 'IV', 'V', 'VI'][n - 1]}) de ${m.name}.`, 'good');
    if (L) await IO.info(`Debilidad de ${m.name} · ${['I', 'II', 'III', 'IV', 'V', 'VI'][n - 1]}`, `<img class="bigcard" src="assets/lw_${m.abil}.jpg" alt=""><div class="txt">${weakTxt(m.abil, n)}</div>`, { kind: 'info' });

  if (!LG()) return;

  G.weak[t] = shuffle([1, 2, 3, 4, 5, 6]); G.weakOn[t] = null;
}

// ---------- Utilidades ----------
async function fetchColor(p, col, fromDisc = true) {
  const pool = [...p.deck, ...(fromDisc ? p.discard : [])].filter(c => CARDS[c].color === col);

<script>
// ===== Turno del automa =====
function botDrawAction(b) {
  if (!b.actDeck.length) { b.actDeck = shuffle(b.actDisc.filter(id => ACARD(id).lvl === 3)); b.actDisc = b.actDisc.filter(id => ACARD(id).lvl !== 3); }
  if (!b.actDeck.length) { b.actDeck = shuffle(b.actDisc); b.actDisc = []; }
  return b.actDeck.shift();
}
function arrowPick(locs, arrow) { return locs.slice().sort((a, b) => arrow === 'up' ? b - a : a - b)[0]; }
function monAtLoc(loc) { const t = monsterAt(loc); return t ? { t, m: MON(G.mon[t].n) } : null; }
function pickByMonsters(b, locs, arrow) {
  if (locs.length <= 1) return locs[0];
  const withM = locs.filter(l => monAtLoc(l));
  if (withM.length) {
    const tr = withM.filter(l => hasTrail(b, monAtLoc(l).t));
    let pool = tr.length ? tr : withM;
    const minHp = Math.min(...pool.map(l => monAtLoc(l).m.hp));
    pool = pool.filter(l => monAtLoc(l).m.hp === minHp);
    return arrowPick(pool, arrow);
  }
  return arrowPick(locs, arrow);
}
function botTarget(b, ac) {
  if (ac.tgt !== 'stag') return ac.tgt;
  const ms = 'FMW'.split('').filter(t => G.mon[t]).map(t => ({ t, loc: G.mon[t].loc, m: MON(G.mon[t].n) }));
  if (!ms.length) return b.loc;
  const minL = Math.min(...ms.map(x => x.m.lvl));
  let pool = ms.filter(x => x.m.lvl === minL);
  const tr = pool.filter(x => hasTrail(b, x.t)); if (tr.length) pool = tr;
  const minHp = Math.min(...pool.map(x => x.m.hp)); pool = pool.filter(x => x.m.hp === minHp);
  return arrowPick(pool.map(x => x.loc), ac.arrow);
}
function botMoveDest(b, target, mv, arrow) {
  const D = DIST[b.loc][target];
  if (D <= mv) return target;
  const cand = LOCS.map(l => l.id).filter(id => DIST[b.loc][id] === mv && DIST[id][target] === D - mv);
  return pickByMonsters(b, cand, arrow);
}
function trophCond(b, alt) { if (alt.lt != null) return b.troph < alt.lt; if (alt.le != null) return b.troph <= alt.le; return true; }
const BOT_ICON = { hi: 'sube su atributo más alto', lo: 'sube su atributo más bajo', atk: 'sube Combate', def: 'sube Defensa', alc: 'sube Alquimia', spe: 'sube Especialidad', pot: 'roba 1 Poción', trail: 'obtiene un Rastro' };
async function botTurn(b) {
  b.flags = b.flags || {};
  log(`— Turno de ${pname(b)} —`, 'turn');
  const id = botDrawAction(b); const ac = ACARD(id);
  const summary = [];
  // Fase I: movimiento
  const target = botTarget(b, ac);
  const dest = botMoveDest(b, target, ac.mv, ac.arrow);
  const from = b.loc;
  if (dest !== b.loc) { b.loc = dest; if (G.horse === dest) { await checkHorse(b, dest); summary.push('Encuentra el Lost Mount.'); } summary.push(`Viaja de <b>${LOC(from).name}</b> a <b>${LOC(dest).name}</b> (objetivo: ${LOC(target).name}${ac.tgt === 'stag' ? ', el monstruo de menor nivel' : ''}).`); log(`${b.name} viaja a ${LOC(dest).name}.`); }
  else summary.push(`Se queda en <b>${LOC(b.loc).name}</b>.`);
  upd();
  // Fase I: acciones
  for (const a of ac.p1) {
    const before = JSON.stringify(b.attrs);
    if (a === 'hi') await raiseAttr(b, highestAttr(b));
    else if (a === 'lo') await raiseAttr(b, lowestAttr(b));
    else if (ATTRS.includes(a)) await raiseAttr(b, a);
    else if (a === 'pot') { if (b.potions.length < 4) await gainPotion(b, 1); }
    else if (a === 'trail') { const t = LOC(b.loc).terr; if (!hasTrail(b, t) && G.locPile[t].length) { b.trails[t] = drawLocToken(t); log(`${b.name} obtiene un Rastro de ${TERR[t]}.`); } }
    summary.push(BOT_ICON[a] + (JSON.stringify(b.attrs) !== before ? ' → ' + ATTRS.map(x => ATTR_NAME[x][0] + b.attrs[x]).join(' ') : ''));
  }
  if (b.flags.horse2) { b.flags.horse2 = false; await placeHorse(b); summary.push(`Recoloca el Lost Mount en ${LOC(G.horse).name}.`); }
  // Fase II
  await IO.botTurn(b, ac, summary, 'p1');
  let did = null;
  for (const alt of ac.p2) {
    if (alt === 'med') {
      const a = ATTRS.find(x => b.attrs[x] >= 5 && G.atroph[x] > 0 && !hasA(b, x));
      if (a) { G.atroph[a]--; did = `Medita y obtiene el Trofeo de ${ATTR_NAME[a]}.`; log(`${b.name} medita.`); await IO.botAnnounce(b, did); await gainTrophy(b, { t: 'attr', a }, true); break; }
      continue;
    }
    if (alt.f === 'M') {
      const t = monsterAt(b.loc);
      if (t && trophCond(b, alt)) { const mn = MON(G.mon[t].n).name; await IO.botAnnounce(b, `Combate contra ${mn}.`); const r = await botFightMonster(b, t); did = `Combate contra ${mn}: ${r === 'win' ? '¡lo derrota y gana un Trofeo!' : r === 'repel' ? 'lo ahuyenta.' : 'es derrotado.'}`; break; }
      continue;
    }
    if (alt.f === 'W') {
      const l = LOC(b.loc);
      if (l.act === 'school' || G.tavern === b.loc) continue;
      const foes = G.players.filter(o => o !== b && o.loc === b.loc);
      if (!foes.length) continue;
      const foe = foes.find(o => !o.bot && !hasW(b, o.school)) || foes.find(o => !hasW(b, o.school)) || foes[0];
      await IO.botAnnounce(b, `¡Desafía a ${pname(foe)} a un combate!`); const w = await fightWitcher(b, foe); did = `Combate contra ${pname(foe)}: gana ${pname(w)}.`; break;
    }
  }
  if (G.winner != null) { b.actDisc.push(id); return; }
  if (!did) { did = 'Explora (sin efecto para el automa).'; }
  // Fase III: descartar del mercado
  const removed = [];
  for (const s of ac.p3) { const i = s - 1; if (G.market[i]) { removed.push(CARDS[G.market[i]].name); G.adisc.push(G.market[i]); G.market[i] = null; } }
  refillMarket();
  b.actDisc.push(id);
  log(`${b.name} descarta del mercado: ${removed.join(', ') || 'nada'}.`);
  await IO.botTurn(b, ac, [...summary, did, `Descarta del mercado los espacios ${ac.p3.join(' y ')}${removed.length ? ': ' + removed.join(', ') : ''}.`], 'end');
  upd();
}

const GROUPS = [...new Set(CH.map(c => c.g))];
let cur = 0;
function render() {
  const c = CH[cur];
  $('#tutBody').innerHTML = `<div class="tg">${c.g} · ${cur + 1}/${CH.length}</div><h2>${c.t}</h2>${c.h}`;
  $('#tutNav').innerHTML = GROUPS.map(g => `<button data-g="${g}" class="${g === c.g ? 'on' : ''}">${g}</button>`).join('');
  $('#tutNav').querySelectorAll('button').forEach(b => b.onclick = () => { cur = CH.findIndex(x => x.g === b.dataset.g); render(); });
  $('#tutPrev').disabled = cur === 0;
  $('#tutNext').textContent = cur === CH.length - 1 ? 'Terminar' : 'Siguiente';
  $('#tutBody').scrollTop = 0;
  $('#tutBody').querySelectorAll('img').forEach(i => i.onclick = () => { const z = $('#zoom'); z.querySelector('img').src = i.src; z.classList.remove('hidden'); });
  if ($('#tCombo')) comboTrainer();
  if ($('#tRoll')) $('#tRoll').onclick = () => { const d = [1, 2, 3, 4, 5].map(() => 1 + Math.floor(Math.random() * 6)); $('#tDice').innerHTML = d.map(v => `<span class="tdie">${v}</span>`).join('') + `<b>${POKER_NAMES[pokerEval(d).rank]}</b>`; };
}
function comboTrainer() {
  const hand = ['007-056', '003-023', '015-128', '005-036', '069-592'];
  const combo = [];
  const draw = () => {
    const p = { hand };
    const legal = new Set(legalNext(p, combo, {}));
    const ev = comboEval(p, combo, false, {});
    $('#tCombo').innerHTML = `<div class="trow small">${combo.map(c => `<img class="tcard s" src="${A(CARDS[c].img)}">`).join('<span>→</span>') || '<span>Elige la primera carta</span>'}</div>
      <div class="tres">${combo.length ? `Daño <b>${ev.dmg}</b> · Escudo <b>+${ev.sh}</b> · Robo <b>${ev.m >= 0 ? '+' : ''}${ev.m}</b>` : ''}</div>
      <div class="trow">${hand.filter(c => !combo.includes(c)).map(c => `<img class="tcard ${legal.has(c) ? '' : 'dim'}" data-c="${c}" src="${A(CARDS[c].img)}">`).join('')}</div>
      <button class="tbtn" id="tReset">Empezar de nuevo</button>`;
    $('#tCombo').querySelectorAll('[data-c]').forEach(e => e.onclick = ev2 => { ev2.stopPropagation(); if (legal.has(e.dataset.c)) { combo.push(e.dataset.c); draw(); } });
    $('#tReset').onclick = () => { combo.length = 0; draw(); };
  };
  draw();
}
window.openTutorial = (group) => {
  if (!$('#tut')) {
    const d = document.createElement('div'); d.id = 'tut'; d.className = 'hidden';
    d.innerHTML = `<div id="tutTop"><b>Tutorial</b><button class="icobtn" id="tutX" aria-label="Cerrar">✕</button></div><div id="tutNav"></div><div id="tutBody"></div><div id="tutBar"><button class="btn" id="tutPrev">Anterior</button><button class="btn main" id="tutNext">Siguiente</button></div>`;
    document.body.appendChild(d);
    $('#tutX').onclick = () => d.classList.add('hidden');
    $('#tutPrev').onclick = () => { if (cur > 0) { cur--; render(); } };
    $('#tutNext').onclick = () => { if (cur < CH.length - 1) { cur++; render(); } else d.classList.add('hidden'); };
  }
  cur = group ? Math.max(0, CH.findIndex(c => c.g === group)) : 0;
  $('#tut').classList.remove('hidden'); render();
};
}

<script>
// ===== Interfaz =====
{
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const face = s => `assets/face_${s}.jpg`;
let TAB = 'hand';
let mapZoom = 1.8;
let p1State = null;           // estado de Fase I (resolver de movimiento)
let pickState = null;         // selección de cartas en el dock
let SPEED = 1;
try { SPEED = +localStorage.getItem('tow_speed') || 1; } catch (e) { }

// ---------- utilidades de modal ----------
function sheet(html) { $('#sheet').innerHTML = html; $('#modal').classList.remove('hidden'); $('#sheet').scrollTop = 0; }
function closeSheet() { $('#modal').classList.add('hidden'); $('#sheet').innerHTML = ''; }
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 1800); }
function zoomImg(src, txt) { const z = $('#zoom'); z.querySelector('img').src = src; const t = z.querySelector('.ztxt'); t.textContent = txt || ''; t.style.display = txt ? '' : 'none'; z.classList.remove('hidden'); }
function zoomCard(id) { const d = CARDS[id]; zoomImg(d.img, d.txt ? d.name + ': ' + d.txt : ''); }
$('#zoom').onclick = () => $('#zoom').classList.add('hidden');
function cardDiv(id, extra = '') { return `<div class="card ${extra}" data-c="${id}" style="background-image:url(${CARDS[id].img})"></div>`; }
function optBtn(o, i) {
  const img = o.img ? `<img src="${o.img}" alt="">` : '';
  return `<button class="btn ${o.main ? 'main' : ''}" data-i="${i}" ${o.disabled ? 'disabled' : ''}><span class="optimg">${img}<span>${esc(o.label)}${o.sub ? `<small>${esc(o.sub)}</small>` : ''}</span></span></button>`;
}
function waitSheetChoice(title, opts, bodyHtml = '') {
  return new Promise(res => {
    sheet(`<h3>${esc(title)}</h3>${bodyHtml}<div class="opts">${opts.map(optBtn).join('')}</div>`);
    $('#sheet').querySelectorAll('.opts .btn').forEach(b => b.onclick = () => { closeSheet(); res(opts[+b.dataset.i].value); });
  });
}
function waitOk(title, html, label = 'Continuar') { return waitSheetChoice(title, [{ label, value: 1, main: true }], html); }

// ---------- cabecera y mapa ----------
function phaseLabel() {
  if (!G) return '';
  const p = curP();
  const ph = G.phase === 1 ? 'Fase I · Movimiento y acciones' : G.phase === 2 ? 'Fase II · Combatir, meditar o explorar' : 'Fase III · Robar y obtener cartas';
  return p.bot ? `Turno de ${p.name} (automa)` : `${G.solo ? 'Turno ' + G.soloTurns : 'Ronda ' + G.round} · ${ph}`;
}
function renderTop() {

function cropDiv(img, y0, y1) {
  // muestra la franja [y0,y1] (px de la carta 579x899)
  const h = y1 - y0;
  return `<div class="crop" style="background-image:url(${img});aspect-ratio:579/${h};background-position:0 ${(y0 / (899 - h) * 100).toFixed(2)}%;background-size:100% ${(899 / h * 100).toFixed(2)}%"></div>`;
}
function cardChoice(o) {
  const x = o.x; const y = x.y || [];
  const head = o.kind === 'explo' ? `${o.deck === 'city' ? 'Ciudad' : 'Tierras Salvajes'}` : `Evento ${o.n}`;
  const intro = y.length === 4 ? cropDiv(o.img, 20, y[0] - 6) : `<div class="txt">${esc(x.intro)}</div>`;
  const crop = y.length === 4; const opts = [{ label: crop ? 'Elegir opción A' : 'A: ' + (x.optA || 'Opción A'), value: 'A' }, { label: crop ? 'Elegir opción B' : 'B: ' + (x.optB || 'Opción B'), value: 'B' }];
  // opciones que no se pueden pagar
  const h = human();
  for (const [k, o2] of [['A', opts[0]], ['B', opts[1]]]) {
    const ops = x[k] || [];
    const g = ops.find(op => op[0] === 'gold' && op[1] < 0); if (g && h.gold < -g[1]) { o2.disabled = true; o2.sub = `Necesitas ${-g[1]} de Oro`; }
    // coste de bajar un Atributo: no se puede pagar si está a nivel 1 o fijado a nivel 5
    const a = ops.find(op => op[0] === 'attr' && ATTRS.includes(op[1]) && op[2] < 0); if (a && (h.attrs[a[1]] <= 1 || h.attrs[a[1]] >= 5)) { o2.disabled = true; o2.sub = `No puedes bajar ${ATTR_NAME[a[1]]} (nivel ${h.attrs[a[1]]})`; }
  }
  if (opts.every(o => o.disabled)) opts.forEach(o => { o.disabled = false; o.sub = 'Ninguna opción es pagable: se resuelve lo posible'; });
  return waitSheetChoice(head, opts, intro + (y.length === 4 ? cropDiv(o.img, y[0] - 4, y[2] - 6) : ''));
}
function cardResult(o) {

  const crop = y.length === 4 ? (o.opt === 'A' ? cropDiv(o.img, y[2] - 4, y[3] - 6) : cropDiv(o.img, y[3] - 4, 880)) : `<div class="txt">${esc(x['res' + o.opt])}</div>`;
  const eff = x['txt' + o.opt];

}
function diceView(title, mine, theirs, sub) {
  return waitOk(title, `${sub ? `<div class="txt">${esc(sub)}</div>` : ''}<div class="dlabel">Tus dados</div><div class="dice">${mine.map(dieFace).join('')}</div>${theirs ? `<div class="dlabel">Rival</div><div class="dice">${theirs.map(dieFace).join('')}</div>` : ''}`);

function pickDice(title, d) {
  return new Promise(res => {

      sheet(`<h3>${esc(title)}</h3><div class="txt">${POKER_NAMES[pokerEval(d).rank]}. Toca los dados que quieras volver a tirar.</div><div class="dice">${d.map((v, i) => `<div class="die ${sel.has(i) ? 'sel' : ''}" data-i="${i}">${v}</div>`).join('')}</div><div class="opts"><button class="btn main" id="dOk">${sel.size ? 'Volver a tirar ' + sel.size : 'Plantarse'}</button></div>`);

// ---------- combate ----------
let CUR_C = null, comboResolve = null, comboState = null;
function fighterBox(f) {
  if (f.type === 'm') { const pct2 = f.pool.length / f.m.hp * 100; return `<div class="card" style="background-image:url(assets/m_${f.m.img}.jpg)" data-zoom="assets/m_${f.m.img}.jpg"></div><div class="info"><h4>${esc(f.m.name)}</h4><div class="meter">Vida <div class="bar"><i style="width:${pct2}%"></i></div> <b>${f.pool.length}/${f.m.hp}</b></div><div class="small">${esc(MON_ABIL_TXT[f.m.abil])}${f.ignoreAbil ? ' (habilidad anulada en este combate)' : ''}${G.exp.mtLarge && LARGE[f.m.abil] ? `<br><span class="lnk" data-zoom="assets/la_${f.m.abil}.jpg">Ver ataques especiales</span>` : ''}</div></div>`; }
  const p = f.p; const S = SCHOOLS[p.school];
  if (f.type === 'b') return `<div class="card" style="background-image:url(${face(p.school)});aspect-ratio:1;background-size:cover"></div><div class="info"><h4>${esc(p.name)}</h4><div class="meter">Mazo <div class="bar"><i style="width:${Math.min(100, (p.cdeck || []).length * 8)}%"></i></div> <b>${(p.cdeck || []).length}</b></div><div class="small">Escudo ${p.shield}/${shieldMax(p)} · Pociones ${p.potions.length}${f.immune ? ' · inmune este turno' : ''}</div></div>`;
  return `<div class="card" style="background-image:url(${face(p.school)});aspect-ratio:1;background-size:cover"></div><div class="info"><h4>${esc(p.name)}</h4><div class="small">Mazo ${p.deck.length} · Mano ${p.hand.length} · Escudo ${p.shield}</div></div>`;
}
function renderCombat(C) {
  CUR_C = C;
  const me = C.h, foe = me ? (C.A === me ? C.B : C.A) : C.B;
  const watch = !me;
  $('#cfoe').innerHTML = watch ? `<div style="flex:1;display:flex;gap:8px">${fighterBox(C.A)}</div>` : fighterBox(foe);
  if (watch) $('#cfoe').innerHTML += `<div style="flex:1;display:flex;gap:8px">${fighterBox(C.B)}</div>`;
  $('#cfoe').querySelectorAll('[data-zoom]').forEach(e => e.onclick = () => zoomImg(e.dataset.zoom));
  const last = C.lastMon ? `<div class="lastatk"><div class="card" style="background-image:url(${mcImg(C.lastMon.card)})" data-z="${mcImg(C.lastMon.card)}"></div><span>Último ataque: <b>${C.lastMon.type === 'C' ? 'Carga' : C.lastMon.type === 'M' ? 'Mordisco' : 'Especial'}</b></span></div>` : '';
  $('#clog').innerHTML = C.lines.map(l => `<div class="${l.c}">${esc(l.m)}</div>`).join('') + last;
  $('#clog').scrollTop = 1e6;
  $('#clog').querySelectorAll('[data-z]').forEach(e => e.onclick = () => zoomImg(e.dataset.z));
  if (me) {
    const p = me.p;
    const lim = monAbil(C, 'bagua') ? 1 : VAL[p.attrs.alc];
    $('#cme').innerHTML = `<span>Escudo <b>${p.shield}/${shieldMax(p)}</b></span><span>Mazo (vida) <b>${p.deck.length}</b></span><span>Mano <b>${p.hand.length}</b></span><span>Descartes <b>${p.discard.length}</b></span><span>Pociones <b>${p.potions.length}</b>${(p.bombs || []).length ? ` · Bombas <b>${p.bombs.length}</b>` : ''} (usadas ${me.potUsed}/${lim})</span>`;
  } else $('#cme').innerHTML = '<span class="small">Combate entre otros: observa el resultado.</span>';
  if (comboState) {
    const st = comboState;
    $('#ccombo').innerHTML = st.combo.length ? st.combo.map(c => `<div class="card" style="background-image:url(${CARDS[c].img})"></div>`).join('<span>→</span>') : '<span class="small">Elige la primera carta del combo.</span>';
    const T = C.T || { dmg: 0 };
    $('#cpred').innerHTML = st.combo.length ? `Daño ${st.ev.dmg + (T.dmg || 0)} · Escudo +${st.ev.sh} · Robo ${st.ev.m >= 0 ? '+' : ''}${st.ev.m}${st.ev.tops ? ' · recupera ' + st.ev.tops : ''}${st.ev.rets.length ? ' · vuelve a la mano ' + st.ev.rets.length : ''}` : '';
    const legal = new Set(st.legal);
    $('#chand').innerHTML = me.p.hand.filter(c => !st.combo.includes(c)).map(c => `<div class="card ${legal.has(c) ? '' : 'dim'}" data-c="${c}" style="background-image:url(${CARDS[c].img})"></div>`).join('');
    $('#chand').querySelectorAll('.card').forEach(e => {
      let tm, long = false;
      e.onpointerdown = () => { long = false; tm = setTimeout(() => { long = true; zoomCard(e.dataset.c); }, 450); };
      e.onpointerup = () => clearTimeout(tm);
      e.onclick = () => { if (long) return; if (legal.has(e.dataset.c)) finishCombo({ add: e.dataset.c }); else toast('No conecta con las extensiones de la última carta'); };
    });
    $('#cacts').innerHTML = `${(st.wildOpts || []).map(w => `<button class="btn ${st.armed === w.k ? 'main' : ''}" data-arm="${w.k}">${st.armed === w.k ? '✓ ' : ''}${esc(w.label)}</button>`).join('')}${st.combo.length > (st.randomFirst ? 1 : 0) ? '<button class="btn" id="cUndo">Deshacer</button>' : ''}${st.canExtra ? '<button class="btn" id="cExtra">Ventisca: carta extra</button>' : ''}<button class="btn main" id="cDone" ${st.combo.length ? '' : 'disabled'}>${st.mini ? 'Resolver combo' : 'Atacar con el combo'}</button>`;
    if ($('#cUndo')) $('#cUndo').onclick = () => finishCombo({ undo: 1 });
    $('#cacts').querySelectorAll('[data-arm]').forEach(b => b.onclick = () => finishCombo({ arm: b.dataset.arm }));
    if ($('#cExtra')) $('#cExtra').onclick = () => finishCombo({ extra: 1 });
    $('#cDone').onclick = () => finishCombo({ done: 1 });
  } else if (!combatChoice) {
    $('#ccombo').innerHTML = ''; $('#cpred').innerHTML = '';
    $('#chand').innerHTML = me ? me.p.hand.map(c => `<div class="card" data-c="${c}" style="background-image:url(${CARDS[c].img})"></div>`).join('') : '';
    $('#chand').querySelectorAll('.card').forEach(e => e.onclick = () => zoomCard(e.dataset.c));
    $('#cacts').innerHTML = '';
  }
}
function finishCombo(v) { const r = comboResolve; comboResolve = null; comboState = null; r && r(v); }
let combatChoice = null;
function combatChoose(title, opts) {
  return new Promise(res => {
    combatChoice = true;
    $('#ccombo').innerHTML = `<span class="small">${esc(title)}</span>`; $('#cpred').innerHTML = '';
    $('#cacts').innerHTML = opts.map(optBtn).join('');
    $('#cacts').querySelectorAll('.btn').forEach(b => b.onclick = () => { combatChoice = null; $('#cacts').innerHTML = ''; res(opts[+b.dataset.i].value); });
  });
}

// ---------- IO ----------
const pause = ms => sleep(ms / SPEED);
IO = {
  log() { if (TAB === 'log') renderTab(); },
  update,
  async choose(title, opts, o = {}) {
    if (o.kind === 'combat' && !$('#combat').classList.contains('hidden')) return combatChoose(title, opts);
    if (o.kind === 'phase2' || (!o.kind && opts.length <= 4 && !opts.some(x => x.img) && !$('#combat').classList.contains('hidden') === false && false)) { }
    if (o.kind === 'phase2') { return new Promise(res => { barOpts = { title, opts }; barResolve = res; renderBar(); }); }
    return waitSheetChoice(title, opts);
  },
  async pickCards(title, cards, min, max, o = {}) {
    if (!cards.length) return [];
    if (min === cards.length && max === cards.length && o.kind !== 'order') return cards.slice();
    const h = human();
    const inHand = cards.length === h.hand.length && cards.every(c => h.hand.includes(c)) && $('#combat').classList.contains('hidden') && $('#modal').classList.contains('hidden');
    if (inHand && o.kind !== 'market') return pickInDock(title, cards, min, max, o.kind === 'order');
    return pickInSheet(title, cards, min, max, o.kind === 'order');
  },
  async pickMany(title, opts, min, max) {
    return new Promise(res => {
      const sel = new Set();
      const draw = () => { sheet(`<h3>${esc(title)}</h3><div class="grid">${opts.map((o, i) => `<div class="card ${sel.has(i) ? 'sel' : ''}" data-i="${i}" style="background-image:url(${o.img})"></div>`).join('')}</div><div class="txt small">${opts.map(o => esc(o.label)).join('<br>')}</div><div class="opts"><button class="btn main" id="pmOk">Confirmar (${sel.size})</button></div>`);
        $('#sheet').querySelectorAll('.card').forEach(e => e.onclick = () => { const i = +e.dataset.i; if (sel.has(i)) sel.delete(i); else if (sel.size < max) sel.add(i); draw(); });
        $('#pmOk').onclick = () => { if (sel.size < min) return; closeSheet(); res([...sel].map(i => opts[i].value)); }; };
      draw();
    });
  },
  info(title, html) { return waitOk(title, `<div class="txt">${html}</div>`); },
  die, dice: diceView, pickDice,
  phase1(p, moves, opts) {
    return new Promise(res => {
      p1State = { moves, resolve: v => { barOpts = null; barResolve = null; renderBar(); renderMap(); res(v); } };
      barOpts = { title: moves.length ? 'Toca un lugar brillante del mapa para viajar, o elige una acción:' : 'No puedes moverte más. Elige una acción:', opts };
      barResolve = v => { p1State = null; res(v); };
      renderBar(); renderMap();
      if (!p.flags.moved) centerOn(p.loc);
    });
  },
  market(p, afford) {
    return new Promise(res => {
      sheet(`<h3>Fase III: obtén 1 carta nueva</h3><div class="txt small">Obligatorio. El coste se paga descartando cartas de tu mano (tienes ${p.hand.length}).</div><div class="grid">${afford.map(o => `<div class="card" data-i="${o.i}" style="background-image:url(${CARDS[o.c].img})"><span class="badge">${CARDS[o.c].trash && o.cost ? 'destruye 1' : 'coste ' + o.cost}</span></div>`).join('')}</div><div class="small">Mantén pulsada para ampliar.</div>`);
      $('#sheet').querySelectorAll('.card').forEach(e => { let tm, long = false; e.onpointerdown = () => { long = false; tm = setTimeout(() => { long = true; zoomCard(G.market[+e.dataset.i]); }, 450); }; e.onpointerup = () => clearTimeout(tm); e.onclick = () => { if (long) return; closeSheet(); res(+e.dataset.i); }; });
    });
  },
  cardChoice, cardResult, eventCard, skCard,
  combo(p, st) {
    return new Promise(res => { comboState = st; comboResolve = res; if (!$('#combat').classList.contains('hidden')) renderCombat(CUR_C); else miniCombo(p, st, res); });
  },
  async combatOpen(C) {
    CUR_C = C; C.lines = C.lines || [];
    $('#combat').classList.remove('hidden');
    renderCombat(C);
    if (!C.h) await pause(600);
  },
  combatUpdate(C) { if (!$('#combat').classList.contains('hidden')) renderCombat(C); },
  async combatEnd(C, result, extra) {
    renderCombat(C);
    const txt = { win: '¡Victoria! Has derrotado al monstruo.', repel: 'Has quedado noqueado, pero ahuyentas al monstruo.', defeat: 'Derrota absoluta: el monstruo te ha noqueado.' };
    let title, body;
    if (C.kind === 'mon' && C.h) { title = result === 'win' ? 'Victoria' : result === 'repel' ? 'Monstruo ahuyentado' : 'Derrota'; body = txt[result]; if (result === 'win') body += `<img class="bigcard" src="assets/m_${C.mon.m.back}.jpg" alt="">`; }
    else if (C.kind === 'mon') { const b = (C.A.type === 'b' ? C.A : C.B).p; title = 'Combate del automa'; body = `${esc(b.name)} ${result === 'win' ? 'derrota a' : result === 'repel' ? 'ahuyenta a' : 'es derrotado por'} ${esc(C.mon.m.name)}.`; }
    else { title = 'Fin del combate'; body = `${esc(extra.W.name)} gana a ${esc(extra.L.name)}.`; }
    await waitOk(title, `<div class="txt">${body}</div>`);
    $('#combat').classList.add('hidden'); CUR_C = null; comboState = null;
    update();
  },
  async monsterAttack(C) { await pause(C.h ? 700 : 350); },
  async botCombatCard(C, me, id) { renderCombat(C); await pause(C.h ? 900 : 350); },
  async botTurn(b, ac, summary, stage) {
    update();
    if (stage === 'p1') { centerOn(b.loc); await pause(500); return; }
    const S = SCHOOLS[b.school];
    await waitOk(`Turno de ${b.name} (${S.name})`, `<div class="optimg" style="align-items:flex-start"><img src="assets/s_${ac.id}.jpg" style="width:92px" alt=""><div class="txt">${summary.map(s => '• ' + s).join('<br>')}</div></div><div class="small" style="margin-top:6px">Trofeos: ${b.troph}/4 · ${ATTRS.map(a => ATTR_NAME[a] + ' ' + b.attrs[a]).join(' · ')}</div>`, 'Entendido');
  },
  async botAnnounce(b, msg) { toast(`${b.name}: ${msg}`); await pause(700); },
  async gameOver(w) {
    const h = human();
    let body;
    if (!w.bot && G.solo) { const t = G.soloTurns; const rating = t >= 13 ? 'No está mal… para un novato.' : t >= 11 ? 'Eres alguien en quien se puede confiar.' : t >= 9 ? 'El mundo necesita un profesional, ¡y ese eres tú!' : t >= 7 ? 'Estás en camino de convertirte en una leyenda.' : '¡Eres una leyenda viviente!'; body = `Has completado la partida en <b>${t} turnos</b>.<br>${rating}`; }
    else body = w.bot ? `${esc(w.name)} (${SCHOOLS[w.school].name}) consigue 4 Trofeos y gana la partida.` : '¡Has conseguido 4 Trofeos! El honor de tu escuela resuena en todo el Continente.';
    await waitSheetChoice(w.bot ? 'Derrota' : '¡Victoria!', [{ label: 'Nueva partida', value: 1, main: true }], `<img class="bigcard" src="${face(w.school)}" style="width:140px" alt=""><div class="txt">${body}</div>`);
    showSetup();
  },
};
// combo fuera de combate (combates cortos de eventos)
function miniCombo(p, st, res) {
  const legal = new Set(st.legal);
  sheet(`<h3>Combate corto: juega un combo</h3><div class="txt small">Solo cuentan Daño y Escudo.</div><div class="row" style="margin:6px 0">${st.combo.map(c => cardDiv(c)).join('') || '<span class="small">Elige la primera carta.</span>'}</div><div class="txt"><b>Daño ${st.ev.dmg} · Escudo +${st.ev.sh}</b></div><div class="grid">${p.hand.filter(c => !st.combo.includes(c)).map(c => cardDiv(c, legal.has(c) ? '' : 'dim')).join('')}</div><div class="opts">${st.combo.length ? '<button class="btn" id="mUndo">Deshacer</button>' : ''}<button class="btn main" id="mDone" ${st.combo.length || !p.hand.length ? '' : 'disabled'}>Resolver</button></div>`);
  $('#sheet').querySelectorAll('.grid .card').forEach(e => e.onclick = () => { if (legal.has(e.dataset.c)) { closeSheet(); comboState = null; comboResolve = null; res({ add: e.dataset.c }); } });
  if ($('#mUndo')) $('#mUndo').onclick = () => { closeSheet(); comboState = null; res({ undo: 1 }); };
  $('#mDone').onclick = () => { closeSheet(); comboState = null; res({ done: 1 }); };
}

    el.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { st.mode = b.dataset.m; draw(); });
    el.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { st.school = b.dataset.s; draw(); });
    el.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { st.nb = +b.dataset.n; draw(); });
    el.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { st.diff = b.dataset.d; draw(); });
    el.querySelectorAll('[data-x]').forEach(b => b.onchange = () => { st.exp[b.dataset.x] = b.checked; try { localStorage.setItem('tow_exp', JSON.stringify(st.exp)); } catch (e) { } });
    el.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { st.monChoice = b.dataset.c; draw(); });
    if ($('#resume')) $('#resume').onclick = () => { G = saved; $('#setup').classList.add('hidden'); resumeGame(); };
    $('#tutBtn').onclick = () => openTutorial(st.mode === 'solo' ? null : null);
    $('#go').onclick = () => {
      const others = shuffle(SCHOOL_KEYS.filter(k => k !== st.school));
      const exp = { ...st.exp };
      const opts = st.mode === 'solo' ? { mode: 'solo', school: st.school, exp } : { mode: 'bots', school: st.school, bots: others.slice(0, st.nb).map(s => ({ school: s, diff: st.diff })), monChoice: st.monChoice, exp };
      newGame(opts);
      $('#setup').classList.add('hidden');
      start();
    };
  };
  draw();
}
async function start() {
  update(); setZoom(1.8); centerOn(human().loc);
  const h = human();
  await waitOk('Comienza la partida', `<div class="txt">Eres <b>${esc(SCHOOLS[h.school].hero)}</b> de la ${esc(SCHOOLS[h.school].name)}. Empiezas en <b>${LOC(h.loc).name}</b> con ${h.gold} Oros y ${h.hand.length} cartas.<br><br>${G.solo ? `Objetivo: derrotar a los 3 monstruos y conseguir el Trofeo de <b>${ATTR_NAME[G.soloAttr]}</b>.` : `Rivales: ${bots().map(b => esc(b.name) + ' (' + SCHOOLS[b.school].name + ')').join(', ')}. Los automas juegan antes que tú.`}<br><br>Monstruos: ${'FMW'.split('').filter(t => G.mon[t]).map(t => `${MON(G.mon[t].n).name} en ${LOC(G.mon[t].loc).name}`).join(', ')}.</div>`, '¡Al camino!');
  runGame();
}
function resumeGame() {
  // reanuda desde el inicio del turno guardado
  update(); setZoom(1.8); centerOn(curP().loc);
  runGame();
}
window.addEventListener('beforeunload', () => { });
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) { navigator.serviceWorker.register('sw.js').catch(() => { }); }
showSetup();
}

</script>
